# 时变边界条件展示 - 线性变化
#
# 场景：流量逐步增加（模拟水库蓄水或缓慢泄洪）
# - 起始流量：8 m³/s
# - 终止流量：18 m³/s
# - 变化时长：600秒（10分钟）
# - 变化率：0.0167 m³/s²
#
# 应用场景：
# - 水库缓慢蓄水
# - 计划性泄洪
# - 渐进式调度
# - 负荷斜坡变化
#
# 作者: Claude
# 日期: 2025-10-24

# ============================================================================
# 1. 渠道基本参数
# ============================================================================
canal:
  length: 10000.0        # 渠道长度 (m) = 10 km
  width: 15.0            # 渠道宽度 (m)
  slope: 0.0005          # 渠底坡度
  manning_n: 0.025       # Manning糙率系数
  gravity: 9.81          # 重力加速度 (m/s²)

# ============================================================================
# 2. 网格设置
# ============================================================================
grid:
  nx: 201                # 网格点数
  adaptive: false

# ============================================================================
# 3. 结构物
# ============================================================================
structures:
  - type: sluice_gate
    position: 5000.0
    width: 15.0
    initial_opening: 2.2
    Cd: 0.6

# ============================================================================
# 4. 边界条件
# ============================================================================
boundary_conditions:
  upstream:
    type: flow
    value: 8.0           # 初始流量

  downstream:
    type: depth
    value: 2.5           # 下游水深 (m)

# ============================================================================
# 5. 模拟设置 - 非稳态 + 线性边界
# ============================================================================
simulation:
  type: unsteady

  # 时间参数
  dt: 1.0                # 时间步长 (s)
  total_time: 800.0      # 总时间 (s) = 13.3分钟
  save_interval: 5       # 保存间隔

  # Preissmann求解器参数
  preissmann_max_iter: 10
  max_iterations: 5000
  convergence_tol: 0.001

  # ========== 时变边界条件：线性变化 ==========
  time_varying_bc:
    boundary: upstream   # 作用于上游边界
    type: linear         # 线性变化

    # 线性参数
    start_value: 8.0     # 起始值 (m³/s)
    end_value: 18.0      # 终止值 (m³/s)
    duration: 600.0      # 变化持续时间 (s)

    # 行为：
    # t ≤ 600s: Q(t) = 8 + (18-8) * t/600 = 8 + 0.0167*t
    # t > 600s: Q(t) = 18 (保持恒定)

# ============================================================================
# 6. 输出设置
# ============================================================================
output:
  directory: results_linear
  prefix: linear

  formats:
    - npz
    - png
