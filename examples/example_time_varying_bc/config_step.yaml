# 时变边界条件展示 - 阶跃变化
#
# 场景：突发事件导致流量骤增
# - 初始流量：12 m³/s
# - 事件时刻：300秒（5分钟）
# - 事件后流量：20 m³/s
# - 流量增幅：+67%
#
# 应用场景：
# - 闸门突然开启
# - 水库泄洪
# - 管道破裂
# - 应急调度
#
# 作者: Claude
# 日期: 2025-10-24

# ============================================================================
# 1. 渠道基本参数
# ============================================================================
canal:
  length: 10000.0        # 渠道长度 (m) = 10 km
  width: 15.0            # 渠道宽度 (m)
  slope: 0.0005          # 渠底坡度
  manning_n: 0.025       # Manning糙率系数
  gravity: 9.81          # 重力加速度 (m/s²)

# ============================================================================
# 2. 网格设置
# ============================================================================
grid:
  nx: 201                # 网格点数
  adaptive: false

# ============================================================================
# 3. 结构物
# ============================================================================
structures:
  - type: sluice_gate
    position: 5000.0
    width: 15.0
    initial_opening: 2.5
    Cd: 0.6

# ============================================================================
# 4. 边界条件
# ============================================================================
boundary_conditions:
  upstream:
    type: flow
    value: 12.0          # 初始流量

  downstream:
    type: depth
    value: 2.5           # 下游水深 (m)

# ============================================================================
# 5. 模拟设置 - 非稳态 + 阶跃边界
# ============================================================================
simulation:
  type: unsteady

  # 时间参数
  dt: 1.0                # 时间步长 (s)
  total_time: 600.0      # 总时间 (s) = 10分钟
  save_interval: 5       # 保存间隔

  # Preissmann求解器参数
  preissmann_max_iter: 10
  max_iterations: 5000
  convergence_tol: 0.001

  # ========== 时变边界条件：阶跃变化 ==========
  time_varying_bc:
    boundary: upstream   # 作用于上游边界
    type: step           # 阶跃变化

    # 阶跃参数
    step_time: 300.0     # 阶跃发生时刻 (s)
    value_before: 12.0   # 阶跃前值 (m³/s)
    value_after: 20.0    # 阶跃后值 (m³/s)

    # 行为：
    # t < 300s: Q = 12 m³/s
    # t ≥ 300s: Q = 20 m³/s

# ============================================================================
# 6. 输出设置
# ============================================================================
output:
  directory: results_step
  prefix: step

  formats:
    - npz
    - png
