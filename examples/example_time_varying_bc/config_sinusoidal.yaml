# 时变边界条件展示 - 正弦波动
#
# 场景：模拟日周期性流量变化
# - 基础流量：15 m³/s
# - 波动幅度：±5 m³/s
# - 周期：720秒（12分钟，模拟1天压缩时间）
# - 流量范围：10-20 m³/s
#
# 应用场景：
# - 潮汐影响的河道
# - 日用水量变化
# - 周期性水电调度
#
# 作者: Claude
# 日期: 2025-10-24

# ============================================================================
# 1. 渠道基本参数
# ============================================================================
canal:
  length: 10000.0        # 渠道长度 (m) = 10 km
  width: 15.0            # 渠道宽度 (m)
  slope: 0.0005          # 渠底坡度
  manning_n: 0.025       # Manning糙率系数
  gravity: 9.81          # 重力加速度 (m/s²)

# ============================================================================
# 2. 网格设置
# ============================================================================
grid:
  nx: 201                # 网格点数（每50m一个点）
  adaptive: false

# ============================================================================
# 3. 结构物（可选）
# ============================================================================
structures:
  - type: sluice_gate
    position: 5000.0     # 中点位置
    width: 15.0
    initial_opening: 2.0
    Cd: 0.6

# ============================================================================
# 4. 边界条件
# ============================================================================
boundary_conditions:
  upstream:
    type: flow
    value: 15.0          # 初始流量（将被时变BC覆盖）

  downstream:
    type: depth
    value: 2.5           # 下游水深 (m)

# ============================================================================
# 5. 模拟设置 - 非稳态 + 正弦波动边界
# ============================================================================
simulation:
  type: unsteady

  # 时间参数
  dt: 1.0                # 时间步长 (s)
  total_time: 1440.0     # 总时间 (s) = 24分钟（模拟2个周期）
  save_interval: 10      # 保存间隔

  # Preissmann求解器参数
  preissmann_max_iter: 10
  max_iterations: 5000
  convergence_tol: 0.001

  # ========== 时变边界条件：正弦波动 ==========
  time_varying_bc:
    boundary: upstream   # 作用于上游边界
    type: sinusoidal     # 正弦波动

    # 正弦参数
    base: 15.0           # 基础值 (m³/s)
    amplitude: 5.0       # 振幅 (m³/s)
    period: 720.0        # 周期 (s) = 12分钟
    phase: 0.0           # 初相位 (弧度)

    # 公式：Q(t) = base + amplitude * sin(2π*t/period + phase)
    #       Q(t) = 15 + 5*sin(2π*t/720)
    # 范围：10-20 m³/s

# ============================================================================
# 6. 输出设置
# ============================================================================
output:
  directory: results_sinusoidal
  prefix: sinusoidal

  formats:
    - npz
    - png
