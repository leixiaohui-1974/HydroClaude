# 控制策略2: MPC预测控制（计划性和预测性）
#
# 场景描述：
# 与策略1相同的串联闸泵群系统和扰动场景
# 但采用模型预测控制（MPC），利用其预测和计划能力
#
# MPC优势：
# 1. 前馈预测：提前规划未来的控制动作
# 2. 约束处理：显式处理闸门开度和变化率约束
# 3. 多步优化：在预测时域内全局优化
# 4. 平滑控制：通过控制权重R平滑控制动作
#
# 控制目标：
# 维持监测点水位稳定，同时最小化控制能耗
#
# 与PID对比：
# - PID：反应式控制，快速但可能震荡
# - MPC：计划式控制，平滑但计算量大
#
# 作者: Claude
# 日期: 2025-10-24

# ============================================================================
# 1. 渠道基本参数
# ============================================================================
canal:
  length: 100000.0       # 渠道长度 (m) = 100 km
  width: 10.0            # 渠道宽度 (m)
  slope: 0.0001          # 渠底坡度
  manning_n: 0.025       # Manning糙率系数
  gravity: 9.81          # 重力加速度 (m/s²)

# ============================================================================
# 2. 网格设置
# ============================================================================
grid:
  dx_target: 500.0       # 目标网格间距 (m)
  adaptive: true         # 启用自适应网格

# ============================================================================
# 3. 结构物配置
# ============================================================================
structures:
  # 闸门1 - 上游段控制
  - type: sluice_gate
    position: 25000.0    # 位置 (m) = 25 km
    width: 10.0          # 闸门宽度 (m)
    initial_opening: 1.5 # 初始开度 (m)
    Cd: 0.6              # 流量系数

  # 泵站 - 中段提水
  - type: pump_station
    position: 50000.0    # 位置 (m) = 50 km
    width: 10.0          # 泵站宽度 (m)
    rated_flow: 10.0     # 额定流量 (m³/s)
    rated_head: 5.0      # 额定扬程 (m)
    min_suction_head: 2.0 # 最小吸入水头 (m)

  # 闸门2 - 下游段控制
  - type: sluice_gate
    position: 75000.0    # 位置 (m) = 75 km
    width: 10.0          # 闸门宽度 (m)
    initial_opening: 2.0 # 初始开度 (m)
    Cd: 0.6              # 流量系数

# ============================================================================
# 4. 边界条件
# ============================================================================
boundary_conditions:
  upstream:
    type: flow           # 上游边界：流量（时变）
    value: 10.0          # 初始流量 (m³/s)

  downstream:
    type: depth          # 下游边界：水深
    value: 5.0           # 水深 (m)

# ============================================================================
# 5. 模拟设置 - 控制仿真
# ============================================================================
simulation:
  type: control          # 模拟类型：控制仿真

  # 时间参数
  dt: 2.0                # 时间步长 (s)
  total_time: 1200.0     # 总时间 (s) = 20分钟
  save_interval: 5       # 保存间隔（时间步数）

  # Preissmann求解器参数
  preissmann_max_iter: 15
  max_iterations: 8000
  convergence_tol: 0.001

  # 时变边界条件 - 来水扰动
  time_varying_bc:
    type: step           # 类型：阶跃变化
    boundary: upstream   # 应用于上游边界
    step_time: 300.0     # 突变时间 (s) = 5分钟
    value_before: 10.0   # 突变前流量 (m³/s)
    value_after: 15.0    # 突变后流量 (m³/s)

  # 控制配置 - MPC
  control:
    type: mpc            # 控制器类型：MPC

    # 控制目标
    setpoint: 2.8        # 目标水位 (m)

    # 控制周期
    control_interval: 5  # 控制周期（时间步数）= 10秒

    # 监测点（闸门1上游）
    monitoring_points: [40]

    # 控制点（闸门1）
    control_points: [0]

    # MPC控制器参数
    controller:
      # 时域参数（MPC关键参数）
      prediction_horizon: 20  # 预测时域（长时域，更好的前瞻性）
      control_horizon: 10     # 控制时域
      dt: 10.0                # MPC采样时间 (s)

      # 权重矩阵（平衡跟踪和控制）
      Q_weight: 5.0           # 状态权重（重视跟踪精度）
      R_weight: 2.0           # 控制权重（平滑控制，避免频繁调节）

      # 控制约束
      u_min: 0.5              # 最小闸门开度 (m)
      u_max: 2.5              # 最大闸门开度 (m)
      du_max: 0.2             # 控制变化率限制（比PID更严格，更平滑）

      # 自适应参数（在线辨识）
      adaptation_rate: 0.03   # 参数更新速率
      forgetting_factor: 0.92 # 遗忘因子（较小，快速适应扰动）
      min_update_samples: 3

      # 初始线性模型
      initial_A: [[0.88]]     # 状态转移矩阵
      initial_B: [[0.12]]     # 输入矩阵

# ============================================================================
# 6. 输出设置
# ============================================================================
output:
  directory: results_mpc_predictive  # 输出目录
  prefix: mpc_predictive              # 文件前缀

  formats:
    - npz                # NumPy数据文件
    - png                # 图片
