# 控制策略5: 优化后的MPC控制
#
# 基于系统辨识和频域分析的MPC参数优化：
#
# 系统特性（已辨识）：
# - 时间常数: τ = 18433s ≈ 307 min
# - 时滞: θ = 300s ≈ 5 min
# - 增益: K = 1.0
# - 波速: c = 5.42 m/s
#
# MPC优化策略：
# 1. 预测时域：根据系统时间常数设置
#    Tp ≈ 3τ = 900 min → 选择30步×30s = 900s (15min)
#
# 2. 控制时域：约为预测时域的1/3
#    Tc ≈ Tp/3 = 10步
#
# 3. 采样周期：匹配系统动态
#    dt = 30s（与优化PID一致）
#
# 4. 权重调整：
#    Q: 跟踪误差权重 → 增大（10.0，强调跟踪）
#    R: 控制输入权重 → 适中（2.0，平滑控制）
#
# 5. 约束优化：
#    u_min/max: 根据物理限制
#    du_max: 根据执行器能力
#
# 预期效果：
# - 更准确的预测（基于辨识模型）
# - 更好的扰动抑制
# - 更小的稳态误差
# - 更平滑的控制输入
#
# 作者: Claude AI
# 日期: 2025-10-26

# ============================================================================
# 1. 渠道基本参数
# ============================================================================
canal:
  length: 100000.0       # 渠道长度 (m) = 100 km
  width: 10.0            # 渠道宽度 (m)
  slope: 0.0001          # 渠底坡度
  manning_n: 0.025       # Manning糙率系数
  gravity: 9.81          # 重力加速度 (m/s²)

# ============================================================================
# 2. 网格设置
# ============================================================================
grid:
  dx_target: 500.0       # 目标网格间距 (m)
  adaptive: true         # 启用自适应网格

# ============================================================================
# 3. 结构物配置
# ============================================================================
structures:
  # 闸门1
  - type: sluice_gate
    position: 25000.0
    width: 10.0
    initial_opening: 1.5
    Cd: 0.6

  # 泵站
  - type: pump_station
    position: 50000.0
    width: 10.0
    rated_flow: 10.0
    rated_head: 5.0
    min_suction_head: 2.0

  # 闸门2
  - type: sluice_gate
    position: 75000.0
    width: 10.0
    initial_opening: 2.0
    Cd: 0.6

# ============================================================================
# 4. 边界条件
# ============================================================================
boundary_conditions:
  upstream:
    type: flow
    value: 10.0

  downstream:
    type: depth
    value: 5.0

# ============================================================================
# 5. 模拟设置 - 优化MPC控制
# ============================================================================
simulation:
  type: control

  # 时间参数
  dt: 2.0                # 时间步长 (s)
  total_time: 1200.0     # 总时间 (s) = 20分钟
  save_interval: 5       # 保存间隔

  # 求解器参数
  preissmann_max_iter: 15
  max_iterations: 8000
  convergence_tol: 0.001

  # 时变边界条件 - 来水扰动
  time_varying_bc:
    type: step
    boundary: upstream
    step_time: 300.0     # 突变时间 (s) = 5分钟
    value_before: 10.0   # 突变前流量 (m³/s)
    value_after: 15.0    # 突变后流量 (m³/s)（+50%扰动）

  # 优化后的MPC控制配置
  control:
    type: mpc            # 控制器类型：MPC

    # 控制目标
    setpoint: 2.8        # 目标水位 (m)

    # 优化的控制周期（与PID一致）
    control_interval: 15 # 15步 × 2s = 30秒

    # 监测点优化（远离闸门，索引约90）
    monitoring_points: [90]

    # 控制点
    control_points: [0]  # 闸门1

    # 优化后的MPC控制器参数
    controller:
      # 基于系统辨识的预测时域优化
      prediction_horizon: 30  # 30步 × 30s = 900s ≈ 15min（优化前15步）
      control_horizon: 10     # 10步（约为Tp/3）（优化前8步）
      dt: 30.0                # 采样周期30秒（匹配控制周期）

      # 优化的权重矩阵
      Q_weight: 10.0          # 跟踪误差权重（优化前5.0，提高跟踪精度）
      R_weight: 2.0           # 控制输入权重（优化前1.0，适度平滑）

      # 约束
      u_min: 0.5              # 最小闸门开度 (m)
      u_max: 3.0              # 最大闸门开度 (m)
      du_max: 0.2             # 最大控制增量（优化前0.15）

      # 自适应参数（基于系统特性优化）
      adaptation_rate: 0.02   # 较慢适应（系统惯性大）（优化前0.05）
      forgetting_factor: 0.95 # 较长记忆（系统动态慢）（优化前0.92）
      min_update_samples: 5   # 更多样本（提高可靠性）（优化前3）

      # 初始模型（基于系统辨识）
      # 离散化的一阶系统：y(k+1) = a*y(k) + b*u(k)
      # τ = 18433s, dt = 30s → a = exp(-dt/τ) ≈ 0.9984
      # b = K*(1-a) ≈ 0.0016
      initial_A: [[0.998]]    # 接近1（大惯性）
      initial_B: [[0.002]]    # 很小（慢响应）

# 设计说明：
# 
# 1. 预测时域延长（15→30步）：
#    - 更长的预测视野
#    - 更好的扰动预见
#    - 适应系统大惯性
#
# 2. 控制时域适当增加（8→10步）：
#    - 更多的控制自由度
#    - 更优的轨迹规划
#
# 3. 采样周期延长（6s→30s）：
#    - 匹配系统时间常数
#    - 减少计算负担
#    - 避免过度控制
#
# 4. Q权重增大（5→10）：
#    - 更强调跟踪性能
#    - 减小稳态误差
#
# 5. R权重增大（1→2）：
#    - 更平滑的控制输入
#    - 减少执行器磨损
#
# 6. 自适应参数保守化：
#    - 适应率降低（避免过度调整）
#    - 遗忘因子增大（保留更多历史）
#    - 样本数增加（提高鲁棒性）
#
# 7. 初始模型精确化：
#    - 基于辨识的系统参数
#    - 更准确的预测
#    - 更快的收敛

# ============================================================================
# 6. 输出设置
# ============================================================================
output:
  directory: results_mpc_optimized  # 输出目录
  prefix: mpc_optimized              # 文件前缀

  formats:
    - npz
    - png
