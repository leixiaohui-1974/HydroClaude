# 控制策略1: PID控制应对来水和分水扰动
#
# 场景描述：
# 串联闸泵群系统遭遇双重扰动：
# 1. 来水扰动：上游来水从10 m³/s突增至15 m³/s（t=300s）
# 2. 分水扰动：中游取水3 m³/s（t=600s）
#
# 控制目标：
# 通过调节2个闸门的开度，维持3个监测点的水位稳定
# - 监测点1：闸门1上游（20km处）- 目标水位2.5m
# - 监测点2：泵站上游（45km处）- 目标水位3.0m
# - 监测点3：闸门2上游（70km处）- 目标水位2.8m
#
# 控制方式：
# - 采用多点PID控制（每个监测点一个PID控制器）
# - 控制量：2个闸门的开度
# - 控制周期：10秒
#
# 作者: Claude
# 日期: 2025-10-24

# ============================================================================
# 1. 渠道基本参数
# ============================================================================
canal:
  length: 100000.0       # 渠道长度 (m) = 100 km
  width: 10.0            # 渠道宽度 (m)
  slope: 0.0001          # 渠底坡度
  manning_n: 0.025       # Manning糙率系数
  gravity: 9.81          # 重力加速度 (m/s²)

# ============================================================================
# 2. 网格设置
# ============================================================================
grid:
  dx_target: 500.0       # 目标网格间距 (m)（粗网格加快仿真）
  adaptive: true         # 启用自适应网格

# ============================================================================
# 3. 结构物配置
# ============================================================================
structures:
  # 闸门1 - 上游段控制
  - type: sluice_gate
    position: 25000.0    # 位置 (m) = 25 km
    width: 10.0          # 闸门宽度 (m)
    initial_opening: 1.5 # 初始开度 (m)
    Cd: 0.6              # 流量系数

  # 泵站 - 中段提水
  - type: pump_station
    position: 50000.0    # 位置 (m) = 50 km
    width: 10.0          # 泵站宽度 (m)
    rated_flow: 10.0     # 额定流量 (m³/s)
    rated_head: 5.0      # 额定扬程 (m)
    min_suction_head: 2.0 # 最小吸入水头 (m)

  # 闸门2 - 下游段控制
  - type: sluice_gate
    position: 75000.0    # 位置 (m) = 75 km
    width: 10.0          # 闸门宽度 (m)
    initial_opening: 2.0 # 初始开度 (m)
    Cd: 0.6              # 流量系数

# ============================================================================
# 4. 边界条件
# ============================================================================
boundary_conditions:
  upstream:
    type: flow           # 上游边界：流量（时变）
    value: 10.0          # 初始流量 (m³/s)

  downstream:
    type: depth          # 下游边界：水深
    value: 5.0           # 水深 (m)

# ============================================================================
# 5. 模拟设置 - 控制仿真
# ============================================================================
simulation:
  type: control          # 模拟类型：控制仿真

  # 时间参数
  dt: 2.0                # 时间步长 (s)
  total_time: 1200.0     # 总时间 (s) = 20分钟
  save_interval: 5       # 保存间隔（时间步数）

  # Preissmann求解器参数
  preissmann_max_iter: 15
  max_iterations: 8000
  convergence_tol: 0.001

  # 时变边界条件 - 来水扰动
  time_varying_bc:
    type: step           # 类型：阶跃变化
    boundary: upstream   # 应用于上游边界
    step_time: 300.0     # 突变时间 (s) = 5分钟
    value_before: 10.0   # 突变前流量 (m³/s)
    value_after: 15.0    # 突变后流量 (m³/s)（来水扰动）

  # 控制配置
  control:
    type: pid            # 控制器类型：PID

    # 控制目标（简化版：控制闸门1上游水位）
    setpoint: 2.8        # 目标水位 (m)

    # 控制周期
    control_interval: 5  # 控制周期（时间步数）= 10秒

    # 监测点（网格索引）
    # 闸门1上游约20km处，索引约40
    monitoring_points: [40]

    # 控制点（结构物索引）
    # 控制闸门1（索引0）
    control_points: [0]

    # PID控制器参数（针对闸泵群系统调优）
    controller:
      # 基本参数
      kp: 0.8              # 比例增益（增大以快速响应扰动）
      ki: 0.08             # 积分增益
      kd: 0.15             # 微分增益（增大以抑制超调）

      # 输出限制（闸门开度范围）
      output_min: 0.5      # 最小开度 (m)
      output_max: 3.0      # 最大开度 (m)

      # 积分限制（抗饱和）
      integral_min: -8.0
      integral_max: 8.0

      # 微分滤波系数
      derivative_filter: 0.15

      # 死区
      deadband: 0.02       # 误差死区 (m)

# 注意：分水扰动需要在代码中手动实现
# 在t=600s时，从中游（约60km处）取水3 m³/s
# 这可以通过修改边界条件或添加负流量源来实现

# ============================================================================
# 6. 输出设置
# ============================================================================
output:
  directory: results_pid_disturbance  # 输出目录
  prefix: pid_disturbance              # 文件前缀

  formats:
    - npz                # NumPy数据文件
    - png                # 图片
