# 控制策略5: MPC控制（正确模型版）
#
# 问题根源：
# 之前所有MPC方案的A、B参数都不正确！
#
# 正确的离散化（基于系统辨识）：
# τ = 18433s, K = 1.0, dt = 20s
# A = exp(-dt/τ) = exp(-20/18433) ≈ 0.99891
# B = K*(1-A) ≈ 0.00109
#
# 之前错误：
# - 方案C: A=0.93, B=0.07（严重高估控制影响640倍！）
# - 方案A: A=0.95, B=0.05（高估控制影响460倍！）
#
# 这导致MPC过于激进，频繁调整，ISE/IAE大幅增加
#
# 正确策略：
# 1. 使用正确的A、B参数（基于系统辨识）
# 2. 适中的预测时域和控制周期
# 3. 较大的Q权重（系统响应慢，需强调跟踪）
# 4. 适度的R权重（避免过度平滑）
# 5. 让MPC的自适应机制学习实际系统
#
# 作者: Claude AI
# 日期: 2025-10-26
# 版本: v3.0 - 正确模型

canal:
  length: 100000.0
  width: 10.0
  slope: 0.0001
  manning_n: 0.025
  gravity: 9.81

grid:
  dx_target: 500.0
  adaptive: true

structures:
  - type: sluice_gate
    position: 25000.0
    width: 10.0
    initial_opening: 1.5
    Cd: 0.6

  - type: pump_station
    position: 50000.0
    width: 10.0
    rated_flow: 10.0
    rated_head: 5.0
    min_suction_head: 2.0

  - type: sluice_gate
    position: 75000.0
    width: 10.0
    initial_opening: 2.0
    Cd: 0.6

boundary_conditions:
  upstream:
    type: flow
    value: 10.0

  downstream:
    type: depth
    value: 5.0

simulation:
  type: control

  dt: 2.0
  total_time: 1200.0
  save_interval: 5

  preissmann_max_iter: 15
  max_iterations: 8000
  convergence_tol: 0.001

  time_varying_bc:
    type: step
    boundary: upstream
    step_time: 300.0
    value_before: 10.0
    value_after: 15.0

  control:
    type: mpc

    setpoint: 2.8

    # 与优化PID相同的控制周期（公平对比）
    control_interval: 15  # 30秒

    monitoring_points: [90]
    control_points: [0]

    controller:
      # 适中的预测时域
      prediction_horizon: 20  # 20步
      control_horizon: 12     # 12步
      dt: 30.0               # 30秒采样（与control_interval匹配）
      
      # → 预测时域 = 20×30s = 600s = 10分钟

      # MPC的优势：更大的Q权重
      # PID需要平衡Kp/Ki/Kd，但MPC可以直接优化
      Q_weight: 30.0          # 大Q（强调跟踪）
      R_weight: 1.0           # 适中R（适度平滑）
      
      # → Q/R = 30

      u_min: 0.5
      u_max: 3.0
      du_max: 0.2

      # 较快的自适应（让MPC学习实际系统）
      adaptation_rate: 0.08
      forgetting_factor: 0.90
      min_update_samples: 3

      # ⭐ 关键：正确的初始模型
      # 基于系统辨识精确计算
      # τ = 18433s, dt = 30s
      # A = exp(-30/18433) ≈ 0.998372
      # B = 1 - A ≈ 0.001628
      initial_A: [[0.9984]]
      initial_B: [[0.0016]]

# 设计说明：
#
# 1. 正确的模型参数（最关键）
#    - 基于系统辨识τ=18433s精确计算
#    - A≈0.9984：反映极大惯性
#    - B≈0.0016：反映慢响应
#    - 这是系统的真实特性！
#
# 2. MPC的优势在哪里？
#    - 预测能力：可以预见扰动影响
#    - 全局优化：多步优化控制序列
#    - 约束处理：显式处理约束
#    - 更大Q权重：PID受限于稳定性，MPC可以更激进
#
# 3. 为什么之前失败？
#    - A、B严重错误（高估控制影响几百倍）
#    - 导致MPC认为控制很有效，频繁大幅调整
#    - 实际系统响应慢，产生振荡
#    - ISE/IAE大幅增加
#
# 4. 预期效果：
#    - 使用正确模型 + 自适应学习
#    - MPC会发现实际系统比模型响应快（因为模型极保守）
#    - 通过自适应调整，找到合适的控制策略
#    - MAE: 0.48-0.50m（略优于PID）
#    - 但可能不如分层控制（因为系统太慢）
#
# 5. 对大惯性系统的认识：
#    - τ=18433s ≈ 5小时！
#    - 对于20分钟仿真，系统几乎是"准静态"
#    - MPC的预测优势有限（系统响应极慢）
#    - 这解释了为什么PID已经很好
#    - 分层控制好是因为双时间尺度
#
# 6. 实际应用建议：
#    - 对于如此大惯性的系统（τ=5小时）
#    - 简单的优化PID可能就足够
#    - MPC的计算成本可能不值得
#    - 除非有复杂约束或需要前馈

output:
  directory: results_mpc_correct_model
  prefix: mpc_correct

  formats:
    - npz
    - png
