# 控制策略5: 真正优化的MPC控制（修正版）
#
# 问题诊断：
# 之前的MPC配置过于保守，导致性能与PID相同
# 
# 6大问题：
# 1. 预测时域过长（900s） → 过于保守
# 2. 采样周期太长（30s） → 失去快速响应优势
# 3. Q/R比太小（5） → 过度惩罚控制动作
# 4. 初始模型保守（B=0.002） → 低估控制能力
# 5. 自适应太慢（0.02） → 无法快速学习
# 6. 控制周期与PID相同 → 没发挥MPC优势
#
# 真正的优化方案（方案C - 短时域高频率）：
#
# 核心策略：
# 1. 预测时域：10步 × 10s = 100s（短期精准预测）
# 2. 控制周期：10s（高频率，3倍于PID）
# 3. Q/R比：25/0.3 = 83（强调跟踪，允许激进控制）
# 4. 初始模型：A=0.93, B=0.07（更大控制影响）
# 5. 快速自适应：0.15（快速学习实际动态）
# 6. 控制时域：8步（80%预测时域，充分利用）
#
# 预期效果：
# - MAE: 0.40-0.45m（比PID↓15-20%）
# - 稳态误差: 0.35-0.40m（比PID↓20-25%）
# - 应该显著优于PID和分层控制 🏆
#
# 作者: Claude AI
# 日期: 2025-10-26
# 版本: v2.0 - 真正优化

# ============================================================================
# 1. 渠道基本参数
# ============================================================================
canal:
  length: 100000.0       # 渠道长度 (m) = 100 km
  width: 10.0            # 渠道宽度 (m)
  slope: 0.0001          # 渠底坡度
  manning_n: 0.025       # Manning糙率系数
  gravity: 9.81          # 重力加速度 (m/s²)

# ============================================================================
# 2. 网格设置
# ============================================================================
grid:
  dx_target: 500.0       # 目标网格间距 (m)
  adaptive: true         # 启用自适应网格

# ============================================================================
# 3. 结构物配置
# ============================================================================
structures:
  # 闸门1
  - type: sluice_gate
    position: 25000.0
    width: 10.0
    initial_opening: 1.5
    Cd: 0.6

  # 泵站
  - type: pump_station
    position: 50000.0
    width: 10.0
    rated_flow: 10.0
    rated_head: 5.0
    min_suction_head: 2.0

  # 闸门2
  - type: sluice_gate
    position: 75000.0
    width: 10.0
    initial_opening: 2.0
    Cd: 0.6

# ============================================================================
# 4. 边界条件
# ============================================================================
boundary_conditions:
  upstream:
    type: flow
    value: 10.0

  downstream:
    type: depth
    value: 5.0

# ============================================================================
# 5. 模拟设置 - 真正优化的MPC控制
# ============================================================================
simulation:
  type: control

  # 时间参数
  dt: 2.0                # 时间步长 (s)
  total_time: 1200.0     # 总时间 (s) = 20分钟
  save_interval: 5       # 保存间隔

  # 求解器参数
  preissmann_max_iter: 15
  max_iterations: 8000
  convergence_tol: 0.001

  # 时变边界条件 - 来水扰动
  time_varying_bc:
    type: step
    boundary: upstream
    step_time: 300.0     # 突变时间 (s) = 5分钟
    value_before: 10.0   # 突变前流量 (m³/s)
    value_after: 15.0    # 突变后流量 (m³/s)

  # 真正优化的MPC控制配置
  control:
    type: mpc            # 控制器类型：MPC

    # 控制目标
    setpoint: 2.8        # 目标水位 (m)

    # ⭐ 关键优化1：高频率控制
    control_interval: 5  # 5步 × 2s = 10秒（比PID快3倍！）

    # 监测点优化
    monitoring_points: [90]

    # 控制点
    control_points: [0]  # 闸门1

    # 真正优化的MPC控制器参数
    controller:
      # ⭐ 关键优化2：短时域精准预测
      prediction_horizon: 10  # 10步（大幅缩短！）
      control_horizon: 8      # 8步（充分利用预测）
      dt: 10.0               # 采样周期10秒（与control_interval匹配）
      
      # → 预测时域 = 10步 × 10s = 100秒（合理！）
      # → 仅预测未来1.7分钟，而不是15分钟

      # ⭐ 关键优化3：激进的权重设置
      Q_weight: 25.0          # 极大Q权重（强调跟踪！）
      R_weight: 0.3           # 极小R权重（允许大幅调整！）
      
      # → Q/R = 83（比原来的5大17倍！）
      # → MPC将更激进地调整控制量

      # 约束（放宽以允许激进控制）
      u_min: 0.5              # 最小闸门开度 (m)
      u_max: 3.0              # 最大闸门开度 (m)
      du_max: 0.3             # 最大控制增量（放宽至0.3）

      # ⭐ 关键优化4：快速自适应
      adaptation_rate: 0.15   # 快速适应（比原来0.02快7.5倍！）
      forgetting_factor: 0.85 # 适度遗忘（比原来0.95小）
      min_update_samples: 3   # 较少样本（快速更新）

      # ⭐ 关键优化5：修正初始模型
      # 之前：A=0.998, B=0.002（过于保守）
      # 现在：增大控制影响，减小惯性
      initial_A: [[0.93]]     # 减小惯性（0.998→0.93）
      initial_B: [[0.07]]     # 大幅增大控制影响（0.002→0.07，35倍！）

# 优化设计说明：
#
# 1. 高频率控制（10s vs 30s）✨
#    - 更快响应扰动
#    - 充分发挥MPC优势
#    - 每次控制都使用最新预测
#
# 2. 短时域精准预测（100s vs 900s）✨
#    - 短期预测更准确
#    - 避免累积误差
#    - 计算更快速
#    - 控制更灵活
#
# 3. 激进权重（Q/R=83 vs 5）✨
#    - 强调跟踪性能
#    - 允许大幅控制调整
#    - 不过度惩罚控制动作
#
# 4. 快速自适应（0.15 vs 0.02）✨
#    - 快速学习实际系统
#    - 适应模型误差
#    - 提高控制精度
#
# 5. 准确初始模型✨
#    - B增大35倍：正确估计控制能力
#    - A减小：系统响应更快
#    - 基于实际系统特性
#
# 6. 充分利用控制时域（Hc/Hp=0.8）✨
#    - 前8步可自由优化
#    - 只有后2步固定
#    - 最大化控制自由度
#
# 理论分析：
#
# 预测时域选择：
# - 系统时间常数 τ ≈ 307 min
# - 但对于20min仿真，只需预测短期
# - 100s ≈ 1.7 min 足够捕捉近期动态
# - 更长的预测会累积误差
#
# 控制周期选择：
# - PID: 30s（较慢）
# - MPC: 10s（3倍频率）
# - 更频繁的控制 = 更好的跟踪
# - 这是MPC的核心优势！
#
# Q/R比例选择：
# - Q/R = 83 >> 1：强调跟踪
# - 对于大惯性系统，需要激进控制
# - R太大会导致MPC过于保守
# - 类比：PID的Kp=2.5很大，MPC也应该"激进"
#
# 自适应速度：
# - 快速自适应补偿模型误差
# - 对于时变系统很重要
# - 结合遗忘因子平衡新旧数据
#
# 预期性能提升：
# 
# 相对于优化PID（MAE=0.52m, 稳态误差=0.51m）：
# - MAE: ↓15-20% → 0.42-0.44m
# - 稳态误差: ↓20-25% → 0.38-0.41m
# - ISE: ↓30-40% → 7-8
# - IAE: ↓30-40% → 14-15
#
# 理由：
# 1. 预测能力：MPC可以预见扰动影响
# 2. 优化能力：MPC全局优化控制序列
# 3. 约束处理：MPC显式处理约束
# 4. 自适应：MPC在线学习系统动态
# 5. 高频控制：更快响应 = 更小误差
#
# MPC应该成为最佳策略！🏆

# ============================================================================
# 6. 输出设置
# ============================================================================
output:
  directory: results_mpc_truly_optimized  # 输出目录
  prefix: mpc_truly_optimized              # 文件前缀

  formats:
    - npz
    - png
