# 控制策略5: 平衡优化的MPC控制（方案A）
#
# 问题分析：
# 方案C（高频激进）导致ISE/IAE大幅增加（振荡过多）
# 
# 调整策略（方案A - 平衡优化）：
# 1. 控制周期：20s（适中，比PID快50%）
# 2. 预测时域：15步×20s=300s（5分钟，合理）
# 3. Q/R比：40（比原来大8倍，但不过激）
# 4. 适度自适应：0.1（快但不过激）
# 5. 改进模型：B=0.05（增大25倍）
#
# 预期效果：
# - 比方案C更平滑（更小ISE/IAE）
# - 比优化PID更好（利用预测优势）
# - MAE: 0.46-0.48m（↓10-12%）
# - 稳态误差: 0.43-0.45m（↓12-15%）
#
# 作者: Claude AI
# 日期: 2025-10-26
# 版本: v2.1 - 平衡优化

# ============================================================================
# 1. 渠道基本参数
# ============================================================================
canal:
  length: 100000.0
  width: 10.0
  slope: 0.0001
  manning_n: 0.025
  gravity: 9.81

# ============================================================================
# 2. 网格设置
# ============================================================================
grid:
  dx_target: 500.0
  adaptive: true

# ============================================================================
# 3. 结构物配置
# ============================================================================
structures:
  - type: sluice_gate
    position: 25000.0
    width: 10.0
    initial_opening: 1.5
    Cd: 0.6

  - type: pump_station
    position: 50000.0
    width: 10.0
    rated_flow: 10.0
    rated_head: 5.0
    min_suction_head: 2.0

  - type: sluice_gate
    position: 75000.0
    width: 10.0
    initial_opening: 2.0
    Cd: 0.6

# ============================================================================
# 4. 边界条件
# ============================================================================
boundary_conditions:
  upstream:
    type: flow
    value: 10.0

  downstream:
    type: depth
    value: 5.0

# ============================================================================
# 5. 模拟设置 - 平衡优化的MPC控制
# ============================================================================
simulation:
  type: control

  dt: 2.0
  total_time: 1200.0
  save_interval: 5

  preissmann_max_iter: 15
  max_iterations: 8000
  convergence_tol: 0.001

  time_varying_bc:
    type: step
    boundary: upstream
    step_time: 300.0
    value_before: 10.0
    value_after: 15.0

  # 平衡优化的MPC控制配置
  control:
    type: mpc

    setpoint: 2.8

    # 适中的控制周期（比PID快50%）
    control_interval: 10  # 10步 × 2s = 20秒

    monitoring_points: [90]
    control_points: [0]

    controller:
      # 合理的预测时域
      prediction_horizon: 15  # 15步
      control_horizon: 10     # 10步（67%预测时域）
      dt: 20.0               # 采样周期20秒
      
      # → 预测时域 = 15步 × 20s = 300秒 = 5分钟（合理）

      # 平衡的权重设置
      Q_weight: 20.0          # 大Q（强调跟踪，但不过激）
      R_weight: 0.5           # 小R（允许调整，但有一定平滑）
      
      # → Q/R = 40（比原来5大8倍，但比方案C的83小一半）

      # 约束
      u_min: 0.5
      u_max: 3.0
      du_max: 0.25            # 适中的增量限制

      # 适度的自适应
      adaptation_rate: 0.1    # 较快（比原0.02快5倍，但比方案C的0.15慢）
      forgetting_factor: 0.88 # 适度遗忘
      min_update_samples: 3

      # 改进的初始模型（不过激）
      initial_A: [[0.95]]     # 适度减小惯性
      initial_B: [[0.05]]     # 增大控制影响（25倍，不是35倍）

# 设计理念：
#
# 1. 平衡控制频率（20s）
#    - 比PID（30s）快50%，有优势
#    - 但不像方案C（10s）那么激进
#    - 避免过度振荡
#
# 2. 合理预测时域（300s）
#    - 5分钟预测足够捕捉系统动态
#    - 不像方案C（100s）太短
#    - 不像原方案（900s）太长
#
# 3. 平衡权重（Q/R=40）
#    - 比原来（5）大8倍，足够强调跟踪
#    - 但比方案C（83）小一半，避免过激
#    - 在跟踪和平滑之间找平衡
#
# 4. 适度自适应（0.1）
#    - 比原来（0.02）快5倍，足够快
#    - 但比方案C（0.15）慢，更稳定
#
# 5. 改进但不过激的模型
#    - B增大25倍（vs 原2倍），显著改善
#    - 但不像方案C的35倍那么激进
#
# 预期性能：
# - MAE: 0.46-0.48m（比PID↓10-12%）
# - 稳态误差: 0.43-0.45m（比PID↓12-15%）
# - ISE: 8-9（比PID↓20-25%，不像方案C那样增加）
# - IAE: 17-19（比PID↓15-20%）
#
# 目标：
# - 显著优于PID（利用MPC预测优势）
# - 避免方案C的过度振荡
# - 平衡的性能提升

# ============================================================================
# 6. 输出设置
# ============================================================================
output:
  directory: results_mpc_balanced
  prefix: mpc_balanced

  formats:
    - npz
    - png
