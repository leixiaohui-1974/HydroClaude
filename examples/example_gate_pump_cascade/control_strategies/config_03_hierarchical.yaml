# 控制策略3: 分层分布式控制（MPC上层 + PID下层）
#
# 控制架构：
#
#                  上层优化（MPC）
#                  ┌─────────────┐
#                  │  全局优化   │
#                  │  计算设定值 │
#                  └──────┬──────┘
#                         │ 设定值
#            ┌────────────┼────────────┐
#            │            │            │
#       ┌────▼───┐   ┌───▼────┐  ┌───▼────┐
#       │ PID 1  │   │ PID 2  │  │ PID 3  │
#       │闸门1   │   │泵站    │  │闸门2   │
#       └────────┘   └────────┘  └────────┘
#         下层执行（分布式PID）
#
# 设计思想：
# 1. 上层MPC：
#    - 以较慢的频率（如1分钟）运行
#    - 考虑全局约束和长期优化
#    - 计算各控制点的最优设定值
#    - 具有预测和计划能力
#
# 2. 下层PID：
#    - 以较快的频率（如10秒）运行
#    - 快速跟踪MPC给定的设定值
#    - 抑制局部扰动
#    - 反应迅速，鲁棒性强
#
# 优势：
# - 结合MPC的全局优化和PID的快速响应
# - 分层架构，计算负担分散
# - 下层控制器可独立运行，提高可靠性
# - 易于扩展到多个控制点
#
# 当前实现：
# 由于框架限制，本示例使用单层MPC模拟分层效果
# 通过调整MPC参数（较长预测时域，较快采样）近似分层控制
#
# 作者: Claude
# 日期: 2025-10-24

# ============================================================================
# 1. 渠道基本参数
# ============================================================================
canal:
  length: 100000.0       # 渠道长度 (m) = 100 km
  width: 10.0            # 渠道宽度 (m)
  slope: 0.0001          # 渠底坡度
  manning_n: 0.025       # Manning糙率系数
  gravity: 9.81          # 重力加速度 (m/s²)

# ============================================================================
# 2. 网格设置
# ============================================================================
grid:
  dx_target: 500.0       # 目标网格间距 (m)
  adaptive: true         # 启用自适应网格

# ============================================================================
# 3. 结构物配置
# ============================================================================
structures:
  # 闸门1
  - type: sluice_gate
    position: 25000.0
    width: 10.0
    initial_opening: 1.5
    Cd: 0.6

  # 泵站
  - type: pump_station
    position: 50000.0
    width: 10.0
    rated_flow: 10.0
    rated_head: 5.0
    min_suction_head: 2.0

  # 闸门2
  - type: sluice_gate
    position: 75000.0
    width: 10.0
    initial_opening: 2.0
    Cd: 0.6

# ============================================================================
# 4. 边界条件
# ============================================================================
boundary_conditions:
  upstream:
    type: flow
    value: 10.0

  downstream:
    type: depth
    value: 5.0

# ============================================================================
# 5. 模拟设置
# ============================================================================
simulation:
  type: control

  # 时间参数
  dt: 2.0
  total_time: 1200.0
  save_interval: 5

  # 求解器参数
  preissmann_max_iter: 15
  max_iterations: 8000
  convergence_tol: 0.001

  # 时变边界条件
  time_varying_bc:
    type: step
    boundary: upstream
    step_time: 300.0
    value_before: 10.0
    value_after: 15.0

  # 控制配置 - 模拟分层控制的MPC
  control:
    type: mpc

    setpoint: 2.8

    # 较快的控制周期（模拟下层PID的快速响应）
    control_interval: 3  # 6秒（比纯MPC快）

    monitoring_points: [40]
    control_points: [0]

    # MPC参数（调优以模拟分层效果）
    controller:
      # 超长预测时域（模拟上层MPC的全局视野）
      prediction_horizon: 25
      control_horizon: 12
      dt: 6.0  # 快速采样

      # 权重平衡（兼顾跟踪和平滑）
      Q_weight: 8.0   # 较高Q：强调跟踪（类似PID）
      R_weight: 1.5   # 中等R：适度平滑

      # 约束
      u_min: 0.5
      u_max: 2.5
      du_max: 0.25

      # 快速自适应（模拟PID的快速响应）
      adaptation_rate: 0.04
      forgetting_factor: 0.90
      min_update_samples: 2

      # 初始模型
      initial_A: [[0.86]]
      initial_B: [[0.14]]

# 注意：
# 真正的分层控制需要：
# 1. 实现上层MPC优化器（计算设定值）
# 2. 实现下层PID控制器（跟踪设定值）
# 3. 设定值传递机制
# 4. 双时间尺度协调
#
# 本配置通过参数调优模拟分层控制的效果

# ============================================================================
# 6. 输出设置
# ============================================================================
output:
  directory: results_hierarchical
  prefix: hierarchical

  formats:
    - npz
    - png
