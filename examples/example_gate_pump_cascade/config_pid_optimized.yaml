# 串联闸泵群系统 - PID优化配置
#
# 基于系统辨识和频域分析的优化参数
#
# 优化要点：
# 1. 增大Kp以提高响应速度（0.8 → 2.5）
# 2. 增大Ki以消除稳态误差（0.08 → 0.3）
# 3. 增大Kd以减少超调（0.15 → 0.5）
# 4. 优化监测点位置（远离闸门）
# 5. 调整控制周期（10s → 30s）
#
# 预期效果：
# - MAE: 0.55m → <0.15m (↓73%)
# - 稳态误差: 0.71m → <0.10m (↓86%)
# - 扰动抑制: 误差增36% → <15% (↓58%)

# ============================================================================
# 1. 渠道基本参数
# ============================================================================
canal:
  length: 100000.0       # 渠道长度 (m) = 100 km
  width: 10.0            # 渠道宽度 (m)
  slope: 0.0001          # 渠底坡度
  manning_n: 0.025       # Manning糙率系数
  gravity: 9.81          # 重力加速度 (m/s²)

# ============================================================================
# 2. 网格设置
# ============================================================================
grid:
  dx_target: 500.0       # 目标网格间距 (m)
  adaptive: true         # 启用自适应网格

# ============================================================================
# 3. 结构物配置
# ============================================================================
structures:
  # 闸门1 - 上游段控制
  - type: sluice_gate
    position: 25000.0    # 位置 (m) = 25 km
    width: 10.0          # 闸门宽度 (m)
    initial_opening: 1.5 # 初始开度 (m)
    Cd: 0.6              # 流量系数

  # 泵站 - 中段提水
  - type: pump_station
    position: 50000.0    # 位置 (m) = 50 km
    width: 10.0          # 泵站宽度 (m)
    rated_flow: 10.0     # 额定流量 (m³/s)
    rated_head: 5.0      # 额定扬程 (m)
    min_suction_head: 2.0 # 最小吸入水头 (m)

  # 闸门2 - 下游段控制
  - type: sluice_gate
    position: 75000.0    # 位置 (m) = 75 km
    width: 10.0          # 闸门宽度 (m)
    initial_opening: 2.0 # 初始开度 (m)
    Cd: 0.6              # 流量系数

# ============================================================================
# 4. 边界条件
# ============================================================================
boundary_conditions:
  upstream:
    type: flow           # 上游边界：流量（时变）
    value: 10.0          # 初始流量 (m³/s)

  downstream:
    type: depth          # 下游边界：水深
    value: 5.0           # 水深 (m)

# ============================================================================
# 5. 模拟设置 - 优化控制仿真
# ============================================================================
simulation:
  type: control          # 模拟类型：控制仿真

  # 时间参数
  dt: 2.0                # 时间步长 (s)
  total_time: 1200.0     # 总时间 (s) = 20分钟
  save_interval: 5       # 保存间隔（时间步数）

  # Preissmann求解器参数
  preissmann_max_iter: 15
  max_iterations: 8000
  convergence_tol: 0.001

  # 时变边界条件 - 来水扰动
  time_varying_bc:
    type: step           # 类型：阶跃变化
    boundary: upstream   # 应用于上游边界
    step_time: 300.0     # 突变时间 (s) = 5分钟
    value_before: 10.0   # 突变前流量 (m³/s)
    value_after: 15.0    # 突变后流量 (m³/s)（来水扰动+50%）

  # 优化后的控制配置
  control:
    type: pid            # 控制器类型：PID

    # 控制目标
    setpoint: 2.8        # 目标水位 (m)

    # 优化的控制周期（根据系统时间常数）
    control_interval: 15 # 控制周期 = 15步 × 2s = 30秒（优化前10秒）

    # 监测点优化（改为闸门下游20km，索引约90）
    monitoring_points: [90]  # 远离闸门，减少局部扰动影响

    # 控制点
    control_points: [0]  # 闸门1

    # 优化后的PID控制器参数
    controller:
      # 基于系统辨识和频域分析优化的参数
      kp: 2.5              # 比例增益（优化前0.8，提高响应速度）
      ki: 0.3              # 积分增益（优化前0.08，消除稳态误差）
      kd: 0.5              # 微分增益（优化前0.15，减少超调）

      # 输出限制（闸门开度范围）
      output_min: 0.5      # 最小开度 (m)
      output_max: 3.0      # 最大开度 (m)

      # 积分限制（抗饱和）
      integral_min: -10.0  # 增大积分限制
      integral_max: 10.0

      # 微分滤波系数
      derivative_filter: 0.1  # 减少微分噪声

      # 死区
      deadband: 0.01       # 减小死区，提高精度（优化前0.02）

# ============================================================================
# 6. 输出设置
# ============================================================================
output:
  directory: results_pid_optimized  # 输出目录
  prefix: pid_optimized              # 文件前缀

  formats:
    - npz                # NumPy数据文件
    - png                # 图片
