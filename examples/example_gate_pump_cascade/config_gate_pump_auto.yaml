# HydroClaude 通用建模系统配置文件
# 示例：明渠串联闸泵群系统（自动化建模）
#
# 作者: Claude
# 日期: 2025-10-24

# ============================================================================
# 1. 渠道基本参数
# ============================================================================
canal:
  length: 100000.0       # 渠道长度 (m) = 100 km
  width: 10.0            # 渠道宽度 (m)
  slope: 0.0001          # 渠底坡度（缓坡）
  manning_n: 0.025       # Manning糙率系数
  gravity: 9.81          # 重力加速度 (m/s²)

# ============================================================================
# 2. 网格设置
# ============================================================================
grid:
  # 使用目标间距，系统自动计算网格点数
  dx_target: 200.0       # 目标网格间距 (m)

  # 自适应网格开关（结构物附近自动加密）
  adaptive: true         # 启用自适应网格

# ============================================================================
# 3. 结构物配置
# ============================================================================
structures:
  # 闸门1 - 上游段控制
  - type: sluice_gate
    position: 25000.0    # 位置 (m) = 25 km
    width: 10.0          # 闸门宽度 (m)
    opening: 1.5         # 开度 (m)
    Cd: 0.6              # 流量系数

  # 泵站 - 中段提水
  - type: pump_station
    position: 50000.0    # 位置 (m) = 50 km
    width: 10.0          # 泵站宽度 (m)
    rated_flow: 10.0     # 额定流量 (m³/s) - 与系统流量一致
    rated_head: 5.0      # 额定扬程 (m) - 关键参数
    min_suction_head: 2.0 # 最小吸入水头 (m)

  # 闸门2 - 下游段控制
  - type: sluice_gate
    position: 75000.0    # 位置 (m) = 75 km
    width: 10.0          # 闸门宽度 (m)
    opening: 2.0         # 开度 (m)
    Cd: 0.6              # 流量系数

# ============================================================================
# 4. 边界条件
# ============================================================================
boundary_conditions:
  upstream:
    type: flow           # 上游边界类型：流量
    value: 10.0          # 流量 (m³/s) - 统一为10.0

  downstream:
    type: depth          # 下游边界类型：水深
    value: 5.0           # 水深 (m)

# ============================================================================
# 5. 模拟设置
# ============================================================================
simulation:
  type: steady           # 模拟类型：稳态

  # 稳态求解参数
  max_iterations: 10000  # 最大迭代次数（复杂系统需要更多迭代）
  convergence_tol: 0.001 # 收敛容差

# ============================================================================
# 6. 输出设置
# ============================================================================
output:
  directory: results_gate_pump_auto  # 输出目录
  prefix: gate_pump_auto             # 文件前缀

  formats:
    - npz                # NumPy数据文件
    - png                # 图片
    - txt                # 验证报告（自动生成）
