[pytest]
# Pytest配置文件

# 测试路径
testpaths = .

# Python文件模式
python_files = test_*.py

# Python类模式
python_classes = Test*

# Python函数模式
python_functions = test_*

# 标记定义
markers =
    slow: 标记为慢速测试（耗时>5秒）
    fast: 标记为快速测试（耗时<1秒）
    integration: 集成测试
    unit: 单元测试

# 输出选项
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes
    -ra

# 最小Python版本
minversion = 6.0

# 控制台输出
console_output_style = progress

# 超时设置（需要安装pytest-timeout）
# timeout = 300

# 并行执行（需要安装pytest-xdist）
# addopts = -n auto
