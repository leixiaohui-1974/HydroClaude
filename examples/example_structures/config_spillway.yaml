# HydroClaude 通用建模系统配置文件
# 示例：溢洪道结构物
#
# 作者: Claude
# 日期: 2025-10-24

# ============================================================================
# 1. 渠道基本参数
# ============================================================================
canal:
  length: 5000.0         # 渠道长度 (m) = 5 km
  width: 15.0            # 渠道宽度 (m)
  slope: 0.002           # 渠底坡度
  manning_n: 0.025       # Manning糙率系数
  gravity: 9.81          # 重力加速度 (m/s²)

# ============================================================================
# 2. 网格设置
# ============================================================================
grid:
  nx: 101                # 网格点数
  adaptive: false        #  不使用自适应网格

# ============================================================================
# 3. 结构物 - Spillway（溢洪道）
# ============================================================================
structures:
  - type: spillway
    position: 2500.0     # 位置 (m) = 2.5 km
    width: 15.0          # 溢洪道宽度 (m)
    crest_elevation: 1.5 # 堰顶高程 (m)
    spillway_type: wes   # WES标准溢洪道
    Cd: 2.1              # 流量系数

# ============================================================================
# 4. 边界条件
# ============================================================================
boundary_conditions:
  upstream:
    type: flow           # 上游边界：流量
    value: 20.0          # 流量 (m³/s)

  downstream:
    type: depth          # 下游边界：水深
    value: 2.0           # 水深 (m)

# ============================================================================
# 5. 模拟设置
# ============================================================================
simulation:
  type: steady           # 模拟类型：稳态

  # 稳态求解参数
  max_iterations: 5000   # 最大迭代次数
  convergence_tol: 0.001 # 收敛容差

# ============================================================================
# 6. 输出设置
# ============================================================================
output:
  directory: results_spillway  # 输出目录
  prefix: spillway             # 文件前缀

  formats:
    - npz                # NumPy数据文件
    - png                # 图片
    - txt                # 验证报告
