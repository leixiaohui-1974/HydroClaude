# HydroClaude 通用建模系统配置文件
# 示例：简单明渠稳态流
#
# 作者: Claude
# 日期: 2025-10-24

# ============================================================================
# 1. 渠道基本参数
# ============================================================================
canal:
  length: 10000.0        # 渠道长度 (m)
  width: 10.0            # 渠道宽度 (m)
  slope: 0.001           # 渠底坡度
  manning_n: 0.025       # Manning糙率系数
  gravity: 9.81          # 重力加速度 (m/s²)

# ============================================================================
# 2. 网格设置
# ============================================================================
grid:
  # 方式1：指定网格点数
  nx: 101               # 网格点数（与dx_target二选一）

  # 方式2：指定目标间距（推荐）
  # dx_target: 100.0    # 目标网格间距 (m)

  # 自适应网格开关
  adaptive: false       # 是否启用自适应网格（需要有结构物）

# ============================================================================
# 3. 结构物（可选）
# ============================================================================
structures: []          # 无结构物

# ============================================================================
# 4. 边界条件
# ============================================================================
boundary_conditions:
  upstream:
    type: flow          # 上游边界类型：flow（流量）
    value: 10.0         # 流量值 (m³/s)

  downstream:
    type: depth         # 下游边界类型：depth（水深）
    value: 2.0          # 水深值 (m)

# ============================================================================
# 5. 模拟设置
# ============================================================================
simulation:
  type: steady          # 模拟类型：steady（稳态）或 unsteady（非稳态）

  # 稳态求解参数
  max_iterations: 5000  # 最大迭代次数
  convergence_tol: 0.001 # 收敛容差

  # 非稳态参数（当type=unsteady时使用）
  # dt: 1.0             # 时间步长 (s)
  # total_time: 3600.0  # 总模拟时间 (s)
  # theta: 0.6          # Preissmann参数

# ============================================================================
# 6. 输出设置
# ============================================================================
output:
  directory: results_simple_canal  # 输出目录
  prefix: simple_canal             # 文件前缀

  formats:              # 输出格式
    - npz               # NumPy数据文件
    - png               # 图片格式

  save_interval: 100    # 保存间隔（对非稳态模拟）
