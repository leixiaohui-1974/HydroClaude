# 工程案例3: 多闸门协同控制
#
# 工程背景：
# 某长距离输水渠道，全长12公里，设置3个调节闸门
# 需要协同控制各段水位，保持在设计范围内，应对流量变化
#
# 控制目标：
# 1. 第1段（0-3km）：水位保持在2.5 m
# 2. 第2段（3-6km）：水位保持在2.3 m
# 3. 第3段（6-9km）：水位保持在2.1 m
# 4. 协同控制，避免相互干扰
#
# 挑战：
# - 多点耦合：上游闸门调节会影响下游
# - 时间延迟：扰动传播需要时间
# - 协调控制：需要考虑整体性能
#
# 作者: Claude
# 日期: 2025-10-24

# ============================================================================
# 1. 渠道基本参数
# ============================================================================
canal:
  length: 12000.0        # 渠道长度 (m) = 12 km
  width: 15.0            # 渠道宽度 (m)
  slope: 0.0005          # 渠底坡度
  manning_n: 0.022       # Manning糙率系数
  gravity: 9.81          # 重力加速度 (m/s²)

# ============================================================================
# 2. 网格设置
# ============================================================================
grid:
  nx: 241                # 网格点数（每50m一个点）
  adaptive: false

# ============================================================================
# 3. 结构物 - 3个Sluice Gates（闸门）
# ============================================================================
structures:
  # 第1个闸门 - 控制第1段水位
  - type: sluice_gate
    position: 3000.0     # 位置 = 3 km
    width: 15.0          # 闸门宽度 (m)
    initial_opening: 1.5 # 初始开度 (m)
    Cd: 0.6              # 流量系数

  # 第2个闸门 - 控制第2段水位
  - type: sluice_gate
    position: 6000.0     # 位置 = 6 km
    width: 15.0
    initial_opening: 1.4
    Cd: 0.6

  # 第3个闸门 - 控制第3段水位
  - type: sluice_gate
    position: 9000.0     # 位置 = 9 km
    width: 15.0
    initial_opening: 1.3
    Cd: 0.6

# ============================================================================
# 4. 边界条件（时变）
# ============================================================================
boundary_conditions:
  upstream:
    type: flow
    value: 25.0          # 初始流量 (m³/s)

  downstream:
    type: depth
    value: 2.0           # 下游水深 (m)

# ============================================================================
# 5. 模拟设置 - 多闸门协同控制
# ============================================================================
simulation:
  type: control

  # 时间参数
  dt: 2.0                # 时间步长 (s)
  total_time: 1200.0     # 总时间 (s) = 20分钟
  save_interval: 5       # 保存间隔

  # Preissmann求解器参数
  preissmann_max_iter: 10
  max_iterations: 5000
  convergence_tol: 0.001

  # 时变边界条件 - 模拟流量扰动
  time_varying_bc:
    boundary: upstream   # 上游边界
    type: step           # 阶跃变化
    step_time: 300.0     # 在t=300s发生扰动
    value_before: 25.0   # 扰动前流量 (m³/s)
    value_after: 32.0    # 扰动后流量 (m³/s) [+28%]

  # 多闸门协同控制配置
  control:
    type: mpc            # 使用MPC实现协同控制

    # 多点控制目标（梯度水位）
    setpoint: [2.5, 2.3, 2.1]  # 三段目标水位 (m)

    # 控制周期
    control_interval: 5  # 控制周期 = 10秒

    # 监测点（测量各段水位）
    # 索引: 30(1.5km), 90(4.5km), 150(7.5km)
    monitoring_points: [30, 90, 150]

    # 控制点（控制3个闸门）
    control_points: [0, 1, 2]

    # MPC控制器参数（多变量协同）
    controller:
      # 时域参数
      prediction_horizon: 18  # 预测时域（较长，考虑耦合）
      control_horizon: 9      # 控制时域
      dt: 10.0                # MPC采样时间 (s)

      # 权重矩阵
      # Q: 3x3对角矩阵，每个监测点的跟踪权重
      # R: 3x3对角矩阵，每个闸门的控制权重
      Q_weight: 3.0           # 状态权重（协同跟踪）
      R_weight: 1.5           # 控制权重（平滑调节）

      # 控制约束（3个闸门）
      u_min: 0.8              # 最小开度 (m)
      u_max: 2.0              # 最大开度 (m)
      du_max: 0.25            # 控制变化率限制

      # 自适应参数（在线辨识耦合关系）
      adaptation_rate: 0.025
      forgetting_factor: 0.93
      min_update_samples: 5

      # 初始线性模型 (3状态 x 3控制)
      # x[k+1] = A*x[k] + B*u[k]
      # A: 3x3 状态转移矩阵（对角主导，弱耦合）
      initial_A:
        - [0.85, 0.10, 0.00]  # 第1段受自身和第2段影响
        - [0.05, 0.85, 0.10]  # 第2段受三段影响
        - [0.00, 0.05, 0.85]  # 第3段受第2、3段影响

      # B: 3x3 输入矩阵（对角主导）
      initial_B:
        - [0.15, 0.00, 0.00]  # 闸门1主要影响第1段
        - [0.05, 0.15, 0.00]  # 闸门2主要影响第2段
        - [0.00, 0.05, 0.15]  # 闸门3主要影响第3段

# ============================================================================
# 6. 输出设置
# ============================================================================
output:
  directory: results_multi_gate_control
  prefix: multi_gate

  formats:
    - npz
    - png
