# 工程案例1: 灌溉渠道优化设计
#
# 工程背景：
# 某灌区需要修建一条主干灌溉渠道，从水源地输水至灌溉区
# 渠道全长5公里，设计流量20 m³/s，末端需保持足够水深以满足取水要求
#
# 设计目标：
# 1. 输水流量：20 m³/s
# 2. 末端水深：≥ 2.0 m
# 3. 优化渠底坡度，使水流稳定
# 4. 验证设计是否满足要求
#
# 作者: Claude
# 日期: 2025-10-24

# ============================================================================
# 1. 渠道基本参数
# ============================================================================
canal:
  length: 5000.0         # 渠道长度 (m) = 5 km
  width: 12.0            # 渠底宽度 (m) - 设计参数
  slope: 0.0008          # 渠底坡度 - 优化参数（初值）
  manning_n: 0.020       # Manning糙率系数（混凝土衬砌）
  gravity: 9.81          # 重力加速度 (m/s²)

# ============================================================================
# 2. 网格设置
# ============================================================================
grid:
  nx: 201                # 网格点数（足够精细以准确计算水面线）
  adaptive: false        # 不使用自适应网格（稳态设计）

# ============================================================================
# 3. 结构物
# ============================================================================
# 本设计案例中没有结构物，是纯渠道设计

# ============================================================================
# 4. 边界条件
# ============================================================================
boundary_conditions:
  upstream:
    type: flow           # 上游边界：设计流量
    value: 20.0          # 流量 (m³/s)

  downstream:
    type: depth          # 下游边界：控制水深
    value: 2.0           # 水深 (m) - 满足取水要求

# ============================================================================
# 5. 模拟设置
# ============================================================================
simulation:
  type: steady           # 模拟类型：稳态设计

  # 收敛参数
  max_iterations: 5000   # 最大迭代次数
  convergence_tol: 0.001 # 收敛容差

# ============================================================================
# 6. 输出设置
# ============================================================================
output:
  directory: results_irrigation_design  # 输出目录
  prefix: irrigation_design              # 文件前缀

  formats:
    - npz                # NumPy数据文件
    - png                # 图片
