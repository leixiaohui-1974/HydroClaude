# 工程案例2: 防洪调度应急响应
#
# 工程背景：
# 某输水渠道，汛期上游水库泄洪，流量从正常的15 m³/s突增至30 m³/s
# 渠道设计流量为25 m³/s，需要通过调节闸门避免下游渠段溢出
#
# 调度目标：
# 1. 监测洪水传播过程
# 2. 通过闸门调节，防止下游水位过高
# 3. 确保渠道安全（不溢出）
# 4. 尽快恢复正常运行
#
# 应急方案：
# - 检测到流量突增后，立即开大闸门
# - 加速洪水下泄，避免上游壅水
# - 待洪峰通过后，逐步恢复闸门开度
#
# 作者: Claude
# 日期: 2025-10-24

# ============================================================================
# 1. 渠道基本参数
# ============================================================================
canal:
  length: 8000.0         # 渠道长度 (m) = 8 km（较长渠道）
  width: 15.0            # 渠道宽度 (m)
  slope: 0.0005          # 渠底坡度（较缓）
  manning_n: 0.022       # Manning糙率系数
  gravity: 9.81          # 重力加速度 (m/s²)

# ============================================================================
# 2. 网格设置
# ============================================================================
grid:
  nx: 161                # 网格点数
  adaptive: false        # 不使用自适应网格

# ============================================================================
# 3. 结构物 - 调节闸门
# ============================================================================
structures:
  - type: sluice_gate
    position: 5000.0     # 位置 (m) = 5 km（渠道中部）
    width: 15.0          # 闸门宽度 (m)
    opening: 1.5         # 初始开度 (m)（正常运行开度）
    Cd: 0.6              # 流量系数

# ============================================================================
# 4. 边界条件
# ============================================================================
boundary_conditions:
  upstream:
    type: flow           # 上游边界：流量（时变）
    value: 15.0          # 初始流量 (m³/s)

  downstream:
    type: depth          # 下游边界：水深
    value: 2.5           # 水深 (m)

# ============================================================================
# 5. 模拟设置 - 非稳态模拟
# ============================================================================
simulation:
  type: unsteady         # 模拟类型：非稳态

  # 时间参数
  dt: 5.0                # 时间步长 (s)
  total_time: 3600.0     # 总时间 (s) = 1小时
  save_interval: 10      # 保存间隔（时间步数）

  # Preissmann求解器参数
  preissmann_max_iter: 15
  max_iterations: 5000
  convergence_tol: 0.001

  # 时变边界条件 - 洪水过程
  time_varying_bc:
    type: step           # 类型：阶跃变化（突发洪水）
    boundary: upstream   # 应用于上游边界
    step_time: 600.0     # 突变时间 (s) = 10分钟后
    value_before: 15.0   # 突变前流量 (m³/s)
    value_after: 30.0    # 突变后流量 (m³/s)（洪水流量）

# 注意：本案例展示洪水传播过程，未包含自动控制
# 实际应急响应中，应在检测到流量突增时立即开大闸门
# 闸门调度策略：
#   t < 600s: 闸门开度1.5m（正常运行）
#   600s ≤ t < 1200s: 建议开大至2.5m（应急响应）
#   t ≥ 1200s: 逐步恢复至1.8m（新稳态）

# ============================================================================
# 6. 输出设置
# ============================================================================
output:
  directory: results_flood_emergency  # 输出目录
  prefix: flood_emergency              # 文件前缀

  formats:
    - npz                # NumPy数据文件
    - png                # 图片
