# HydroClaude 基准测试渠道配置
# 用于IDZ自适应控制基准测试
#
# 作者: Claude
# 日期: 2025-10-24

# ============================================================================
# 1. 渠道基本参数
# ============================================================================
canal:
  length: {LENGTH}       # 渠道长度 (m)
  width: {WIDTH}         # 渠道宽度 (m)
  slope: {SLOPE}         # 渠底坡度
  manning_n: {MANNING}   # Manning糙率系数
  gravity: 9.81          # 重力加速度 (m/s²)

# ============================================================================
# 2. 网格设置
# ============================================================================
grid:
  nx: {NX}               # 网格点数
  adaptive: false        # 不使用自适应网格（无结构物）

# ============================================================================
# 3. 结构物配置
# ============================================================================
structures:
  # 下游闸门 - 作为控制执行器
  - type: sluice_gate
    position: {GATE_POS}  # 位置在下游（渠道长度 - 50m）
    width: {WIDTH}        # 闸门宽度 = 渠道宽度
    opening: {GATE_OPENING}  # 初始开度 (m)
    Cd: 0.6               # 流量系数

# ============================================================================
# 4. 边界条件
# ============================================================================
boundary_conditions:
  upstream:
    type: flow            # 上游边界类型：流量
    value: {Q_UPSTREAM}   # 初始流量 (m³/s)

  downstream:
    type: depth           # 下游边界类型：水深
    value: {H_DOWNSTREAM} # 下游水深 (m)

# ============================================================================
# 5. 模拟设置
# ============================================================================
simulation:
  type: steady            # 先求解稳态作为初值
  max_iterations: 5000    # 最大迭代次数
  convergence_tol: 0.001  # 收敛容差

# ============================================================================
# 6. 输出设置
# ============================================================================
output:
  directory: results_benchmark  # 输出目录
  prefix: benchmark             # 文件前缀
  formats:
    - npz                # NumPy数据文件
    - png                # 图片
