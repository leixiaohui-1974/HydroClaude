# 文件边界条件示例配置
# 展示如何从CSV文件读取时间序列边界条件

project:
  name: "文件边界条件示例"
  description: "展示从CSV文件读取时变边界条件"

canal:
  length: 5000.0        # 渠道长度 (m)
  width: 10.0           # 渠道宽度 (m)
  slope: 0.0001         # 底坡
  manning_n: 0.025      # 曼宁系数
  initial_depth: 2.0    # 初始水深 (m)

grid:
  nx: 101               # 网格点数
  adaptive: false       # 不使用自适应网格

boundary:
  upstream:
    type: flow          # 上游流量边界
    value: 10.0         # 初始流量 (m³/s)
  downstream:
    type: depth         # 下游水深边界
    value: 2.0          # 初始水深 (m)

structures: []          # 无结构物

simulation:
  mode: unsteady        # 非稳态模拟

  steady:
    max_iterations: 100
    tolerance: 1e-6

  unsteady:
    total_time: 1200.0  # 总模拟时间 (s) - 20分钟
    dt: 2.0             # 时间步长 (s)
    save_interval: 10   # 保存间隔

# 时变边界条件 - 从文件读取
time_varying_bc:
  enabled: true
  type: file             # 使用文件类型
  file: flow_data.csv    # CSV文件路径（相对路径）
  boundary: upstream     # 应用到上游边界
  column: flow           # 使用flow列的数据

output:
  directory: results
  save_profiles: true
  save_animation: true
  verbose: true
