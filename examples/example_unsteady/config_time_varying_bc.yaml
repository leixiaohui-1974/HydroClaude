# HydroClaude 通用建模系统配置文件
# 示例：时变边界条件 - 正弦波动流量
#
# 作者: Claude
# 日期: 2025-10-24

# ============================================================================
# 1. 渠道基本参数
# ============================================================================
canal:
  length: 10000.0        # 渠道长度 (m) = 10 km
  width: 10.0            # 渠道宽度 (m)
  slope: 0.001           # 渠底坡度
  manning_n: 0.025       # Manning糙率系数
  gravity: 9.81          # 重力加速度 (m/s²)

# ============================================================================
# 2. 网格设置
# ============================================================================
grid:
  nx: 101                # 网格点数
  adaptive: false        # 非稳态使用均匀网格

# ============================================================================
# 3. 结构物
# ============================================================================
structures: []           # 无结构物

# ============================================================================
# 4. 边界条件（初始值）
# ============================================================================
boundary_conditions:
  upstream:
    type: flow           # 上游边界：流量
    value: 10.0          # 初始流量 (m³/s)

  downstream:
    type: depth          # 下游边界：水深
    value: 2.0           # 水深 (m)

# ============================================================================
# 5. 模拟设置 - 非稳态 + 时变边界条件
# ============================================================================
simulation:
  type: unsteady         # 模拟类型：非稳态

  # 时间参数
  dt: 1.0                # 时间步长 (s)
  total_time: 1200.0     # 总模拟时间 (s) = 20分钟
  save_interval: 20      # 保存间隔

  # Preissmann求解器参数
  preissmann_max_iter: 10
  preissmann_tol: 1e-6

  # 稳态初值参数
  max_iterations: 5000
  convergence_tol: 0.001

  # 时变边界条件
  time_varying_bc:
    type: sinusoidal     # 类型：正弦波动
    boundary: upstream   # 应用到上游边界
    base: 10.0           # 基准流量 (m³/s)
    amplitude: 3.0       # 振幅 (m³/s)
    period: 600.0        # 周期 (s) = 10分钟
    phase: 0.0           # 相位 (弧度)

# ============================================================================
# 6. 输出设置
# ============================================================================
output:
  directory: results_time_varying_bc  # 输出目录
  prefix: time_varying_bc              # 文件前缀

  formats:
    - npz                # NumPy数据文件
    - png                # 图片
