# HydroClaude 通用建模系统配置文件
# 示例：非稳态流动模拟
#
# 作者: Claude
# 日期: 2025-10-24

# ============================================================================
# 1. 渠道基本参数
# ============================================================================
canal:
  length: 10000.0        # 渠道长度 (m) = 10 km
  width: 10.0            # 渠道宽度 (m)
  slope: 0.001           # 渠底坡度
  manning_n: 0.025       # Manning糙率系数
  gravity: 9.81          # 重力加速度 (m/s²)

# ============================================================================
# 2. 网格设置
# ============================================================================
grid:
  nx: 101                # 网格点数
  adaptive: false        # 非稳态通常使用均匀网格

# ============================================================================
# 3. 结构物（可选）
# ============================================================================
structures: []           # 无结构物（简单渠道）

# ============================================================================
# 4. 边界条件
# ============================================================================
boundary_conditions:
  upstream:
    type: flow           # 上游边界：流量
    value: 10.0          # 流量 (m³/s)

  downstream:
    type: depth          # 下游边界：水深
    value: 2.0           # 水深 (m)

# ============================================================================
# 5. 模拟设置 - 非稳态
# ============================================================================
simulation:
  type: unsteady         # 模拟类型：非稳态

  # 时间参数
  dt: 1.0                # 时间步长 (s)
  total_time: 600.0      # 总模拟时间 (s) = 10分钟
  save_interval: 10      # 保存间隔（每10步保存一次）

  # Preissmann隐式求解器参数
  preissmann_max_iter: 10      # 每个时间步的最大迭代次数
  preissmann_tol: 1e-6         # 收敛容差

  # 稳态初值求解参数
  max_iterations: 5000   # 最大迭代次数
  convergence_tol: 0.001 # 收敛容差

# ============================================================================
# 6. 输出设置
# ============================================================================
output:
  directory: results_unsteady_flow  # 输出目录
  prefix: unsteady_flow              # 文件前缀

  formats:
    - npz                # NumPy数据文件
    - png                # 图片
    - txt                # 验证报告

  save_interval: 10      # 与simulation.save_interval保持一致
