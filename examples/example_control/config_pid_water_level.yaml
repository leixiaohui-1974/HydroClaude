# HydroClaude 通用建模系统配置文件
# 示例：PID水位控制
#
# 场景：使用PID控制器调节闸门开度，维持下游水位恒定
#
# 作者: Claude
# 日期: 2025-10-24

# ============================================================================
# 1. 渠道基本参数
# ============================================================================
canal:
  length: 5000.0         # 渠道长度 (m) = 5 km
  width: 10.0            # 渠道宽度 (m)
  slope: 0.001           # 渠底坡度
  manning_n: 0.025       # Manning糙率系数
  gravity: 9.81          # 重力加速度 (m/s²)

# ============================================================================
# 2. 网格设置
# ============================================================================
grid:
  nx: 101                # 网格点数
  adaptive: false        # 不使用自适应网格

# ============================================================================
# 3. 结构物 - Sluice Gate（闸门）
# ============================================================================
structures:
  - type: sluice_gate
    position: 3000.0     # 位置 (m) = 3 km
    width: 10.0          # 闸门宽度 (m)
    initial_opening: 1.0 # 初始开度 (m)
    Cd: 0.6              # 流量系数

# ============================================================================
# 4. 边界条件
# ============================================================================
boundary_conditions:
  upstream:
    type: flow           # 上游边界：流量
    value: 15.0          # 流量 (m³/s)

  downstream:
    type: depth          # 下游边界：水深
    value: 2.0           # 水深 (m)

# ============================================================================
# 5. 模拟设置 - 控制仿真
# ============================================================================
simulation:
  type: control          # 模拟类型：控制仿真

  # 时间参数
  dt: 1.0                # 时间步长 (s)
  total_time: 600.0      # 总时间 (s) = 10分钟
  save_interval: 5       # 保存间隔（时间步数）

  # Preissmann求解器参数
  preissmann_max_iter: 10
  max_iterations: 5000
  convergence_tol: 0.001

  # 控制配置
  control:
    type: pid            # 控制器类型：PID

    # 控制目标
    setpoint: 2.5        # 目标水位 (m)

    # 控制周期
    control_interval: 5  # 控制周期（时间步数）= 5秒

    # 监测点（测量水位的位置）
    monitoring_points: [75]  # 索引75，约3.75km处

    # 控制点（控制的结构物索引）
    control_points: [0]  # 第0个结构物（闸门）

    # PID控制器参数
    controller:
      kp: 0.5            # 比例增益
      ki: 0.05           # 积分增益
      kd: 0.1            # 微分增益

      # 输出限制（闸门开度范围）
      output_min: 0.2    # 最小开度 (m)
      output_max: 2.0    # 最大开度 (m)

      # 积分限制（抗饱和）
      integral_min: -5.0
      integral_max: 5.0

      # 微分滤波系数
      derivative_filter: 0.1

      # 死区
      deadband: 0.01     # 误差死区 (m)

# ============================================================================
# 6. 输出设置
# ============================================================================
output:
  directory: results_pid_control  # 输出目录
  prefix: pid_control              # 文件前缀

  formats:
    - npz                # NumPy数据文件
    - png                # 图片
