# HydroClaude 通用建模系统配置文件
# 示例：MPC水位控制（模型预测控制）
#
# 场景：使用自适应MPC控制器调节闸门开度，维持下游水位恒定
#        MPC具有在线模型辨识和参数自适应能力
#
# 作者: Claude
# 日期: 2025-10-24

# ============================================================================
# 1. 渠道基本参数
# ============================================================================
canal:
  length: 5000.0         # 渠道长度 (m) = 5 km
  width: 10.0            # 渠道宽度 (m)
  slope: 0.001           # 渠底坡度
  manning_n: 0.025       # Manning糙率系数
  gravity: 9.81          # 重力加速度 (m/s²)

# ============================================================================
# 2. 网格设置
# ============================================================================
grid:
  nx: 101                # 网格点数
  adaptive: false        # 不使用自适应网格

# ============================================================================
# 3. 结构物 - Sluice Gate（闸门）
# ============================================================================
structures:
  - type: sluice_gate
    position: 3000.0     # 位置 (m) = 3 km
    width: 10.0          # 闸门宽度 (m)
    initial_opening: 1.2 # 初始开度 (m)
    Cd: 0.6              # 流量系数

# ============================================================================
# 4. 边界条件
# ============================================================================
boundary_conditions:
  upstream:
    type: flow           # 上游边界：流量
    value: 15.0          # 流量 (m³/s)

  downstream:
    type: depth          # 下游边界：水深
    value: 2.0           # 水深 (m)

# ============================================================================
# 5. 模拟设置 - 控制仿真
# ============================================================================
simulation:
  type: control          # 模拟类型：控制仿真

  # 时间参数
  dt: 2.0                # 时间步长 (s)
  total_time: 600.0      # 总时间 (s) = 10分钟
  save_interval: 5       # 保存间隔（时间步数）

  # Preissmann求解器参数
  preissmann_max_iter: 10
  max_iterations: 5000
  convergence_tol: 0.001

  # 控制配置
  control:
    type: mpc            # 控制器类型：MPC（模型预测控制）

    # 控制目标
    setpoint: 2.5        # 目标水位 (m)

    # 控制周期
    control_interval: 5  # 控制周期（时间步数）= 10秒

    # 监测点（测量水位的位置）
    monitoring_points: [75]  # 索引75，约3.75km处

    # 控制点（控制的结构物索引）
    control_points: [0]  # 第0个结构物（闸门）

    # MPC控制器参数
    controller:
      # 时域参数
      prediction_horizon: 10  # 预测时域
      control_horizon: 5      # 控制时域
      dt: 10.0                # MPC采样时间 (s)

      # 权重矩阵（标量形式，自动扩展为对角矩阵）
      Q_weight: 10.0          # 状态跟踪权重（越大越重视跟踪精度）
      R_weight: 0.1           # 控制权重（越大越惩罚控制量）

      # 控制约束
      u_min: 0.2              # 最小控制量（闸门开度下限，m）
      u_max: 2.0              # 最大控制量（闸门开度上限，m）
      du_max: 0.5             # 控制变化率限制（m/步）

      # 自适应参数（在线模型辨识）
      adaptation_rate: 0.01   # 参数更新速率（0-1，越大更新越快）
      forgetting_factor: 0.98 # 遗忘因子（0-1，接近1时更重视历史数据）
      min_update_samples: 5   # 最小更新样本数

      # 初始线性模型（状态空间表示）
      # x[k+1] = A*x[k] + B*u[k]
      # 单输入单输出系统的简化模型
      initial_A: [[0.85]]     # 状态转移矩阵（1x1）
      initial_B: [[0.15]]     # 输入矩阵（1x1）

# ============================================================================
# 6. 输出设置
# ============================================================================
output:
  directory: results_mpc_control  # 输出目录
  prefix: mpc_control              # 文件前缀

  formats:
    - npz                # NumPy数据文件
    - png                # 图片
