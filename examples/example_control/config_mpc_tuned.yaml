# HydroClaude 通用建模系统配置文件
# 示例：MPC水位控制（调优版）
#
# 场景：使用调优后的MPC控制器，改进控制性能
#
# 改进点：
# 1. 调整初始模型矩阵（更接近实际系统）
# 2. 减小Q权重，避免过度追求零误差
# 3. 增大R权重，惩罚过大的控制量
# 4. 放宽控制约束范围
# 5. 减小控制变化率限制
#
# 作者: Claude
# 日期: 2025-10-24

# ============================================================================
# 1. 渠道基本参数
# ============================================================================
canal:
  length: 5000.0         # 渠道长度 (m) = 5 km
  width: 10.0            # 渠道宽度 (m)
  slope: 0.001           # 渠底坡度
  manning_n: 0.025       # Manning糙率系数
  gravity: 9.81          # 重力加速度 (m/s²)

# ============================================================================
# 2. 网格设置
# ============================================================================
grid:
  nx: 101                # 网格点数
  adaptive: false        # 不使用自适应网格

# ============================================================================
# 3. 结构物 - Sluice Gate（闸门）
# ============================================================================
structures:
  - type: sluice_gate
    position: 3000.0     # 位置 (m) = 3 km
    width: 10.0          # 闸门宽度 (m)
    initial_opening: 1.2 # 初始开度 (m)
    Cd: 0.6              # 流量系数

# ============================================================================
# 4. 边界条件
# ============================================================================
boundary_conditions:
  upstream:
    type: flow           # 上游边界：流量
    value: 15.0          # 流量 (m³/s)

  downstream:
    type: depth          # 下游边界：水深
    value: 2.0           # 水深 (m)

# ============================================================================
# 5. 模拟设置 - 控制仿真
# ============================================================================
simulation:
  type: control          # 模拟类型：控制仿真

  # 时间参数
  dt: 2.0                # 时间步长 (s)
  total_time: 600.0      # 总时间 (s) = 10分钟
  save_interval: 5       # 保存间隔（时间步数）

  # Preissmann求解器参数
  preissmann_max_iter: 10
  max_iterations: 5000
  convergence_tol: 0.001

  # 控制配置
  control:
    type: mpc            # 控制器类型：MPC

    # 控制目标
    setpoint: 2.3        # 目标水位 (m) - 更保守的设定值

    # 控制周期
    control_interval: 5  # 控制周期（时间步数）= 10秒

    # 监测点（测量水位的位置）
    monitoring_points: [75]  # 索引75，约3.75km处

    # 控制点（控制的结构物索引）
    control_points: [0]  # 第0个结构物（闸门）

    # MPC控制器参数（调优版）
    controller:
      # 时域参数
      prediction_horizon: 15  # 预测时域（增加到15步，更长远的规划）
      control_horizon: 8      # 控制时域（增加到8步）
      dt: 10.0                # MPC采样时间 (s)

      # 权重矩阵（调优后）
      Q_weight: 1.0           # 状态权重（减小，避免过度追求零误差）
      R_weight: 1.0           # 控制权重（增大，惩罚大控制量）

      # 控制约束（放宽范围）
      u_min: 0.5              # 最小控制量（m）
      u_max: 1.8              # 最大控制量（m）
      du_max: 0.3             # 控制变化率限制（减小，更平滑）

      # 自适应参数
      adaptation_rate: 0.02   # 参数更新速率（稍微增大）
      forgetting_factor: 0.95 # 遗忘因子（减小，更快适应）
      min_update_samples: 3   # 最小更新样本数（减小，更快开始更新）

      # 初始线性模型（调优后）
      # 更保守的模型，避免过度控制
      initial_A: [[0.9]]      # 状态转移矩阵（增加惯性）
      initial_B: [[0.1]]      # 输入矩阵（减小增益）

# ============================================================================
# 6. 输出设置
# ============================================================================
output:
  directory: results_mpc_tuned  # 输出目录
  prefix: mpc_tuned              # 文件前缀

  formats:
    - npz                # NumPy数据文件
    - png                # 图片
