# 结构类型展示案例
#
# 工程场景：
# 某综合水利枢纽工程，包含多种水工建筑物：
# - 上游进水闸（Sluice Gate）
# - 沉砂池过渡段（Transition）
# - 中间调节堰（Weir）
# - 跌水工程（Drop）
# - 溢洪道（Spillway）
# - 出口泵站（Pump Station）
#
# 目的：展示UniversalModeler对所有结构类型的支持
#
# 作者: Claude
# 日期: 2025-10-24

# ============================================================================
# 1. 渠道基本参数
# ============================================================================
canal:
  length: 15000.0        # 渠道长度 (m) = 15 km
  width: 20.0            # 渠道宽度 (m)
  slope: 0.0008          # 渠底坡度
  manning_n: 0.023       # Manning糙率系数
  gravity: 9.81          # 重力加速度 (m/s²)

# ============================================================================
# 2. 网格设置
# ============================================================================
grid:
  nx: 301                # 网格点数（每50m一个点）
  adaptive: false

# ============================================================================
# 3. 结构物 - 展示所有类型
# ============================================================================
structures:
  # ========== 1. 进水闸门 (Sluice Gate) ==========
  - type: sluice_gate
    position: 2000.0     # 位置 = 2 km
    width: 20.0          # 闸门宽度 (m)
    initial_opening: 2.0 # 初始开度 (m)
    Cd: 0.6              # 流量系数
    description: "上游进水闸，控制入流"

  # ========== 2. 过渡段 (Transition) ==========
  - type: transition
    position: 4000.0     # 位置 = 4 km
    width_upstream: 20.0 # 上游宽度 (m)
    width_downstream: 15.0  # 下游宽度 (m) - 收缩
    loss_coefficient: 0.15  # 局部损失系数（收缩：0.1-0.2）
    description: "沉砂池过渡段，渠道收缩"

  # ========== 3. 宽顶堰 (Weir) ==========
  - type: weir
    position: 6000.0     # 位置 = 6 km
    width: 15.0          # 堰宽 (m)
    crest_height: 1.5    # 堰顶高程 (m)
    Cd: 1.7              # 流量系数
    description: "调节堰，控制水位"

  # ========== 4. 跌水 (Drop) ==========
  - type: drop
    position: 8500.0     # 位置 = 8.5 km
    width: 15.0          # 宽度 (m)
    drop_height: 3.0     # 跌水高度 (m)
    Cd: 0.9              # 流量系数
    description: "跌水工程，消能"

  # ========== 5. 溢洪道 (Spillway) ==========
  - type: spillway
    position: 11000.0    # 位置 = 11 km
    width: 15.0          # 溢洪道宽度 (m)
    crest_elevation: 2.0 # 堰顶高程 (m)
    Cd: 2.2              # 流量系数
    design_head: 1.5     # 设计水头 (m)
    description: "溢洪道，泄洪设施"

  # ========== 6. 孔口 (Orifice) ==========
  - type: orifice
    position: 12500.0    # 位置 = 12.5 km
    width: 15.0          # 孔口宽度 (m)
    height: 2.5          # 孔口高度 (m)
    invert_elevation: 0.5  # 孔口底高程 (m)
    Cd: 0.62             # 流量系数
    description: "出水孔口"

  # ========== 7. 泵站 (Pump Station) ==========
  - type: pump_station
    position: 14000.0    # 位置 = 14 km
    width: 15.0          # 宽度 (m)
    rated_flow: 40.0     # 额定流量 (m³/s)
    rated_head: 5.0      # 额定扬程 (m)
    efficiency: 0.85     # 效率
    min_head: 1.0        # 最小运行水头 (m)
    description: "出口泵站，提水"

# ============================================================================
# 4. 边界条件
# ============================================================================
boundary_conditions:
  upstream:
    type: flow
    value: 35.0          # 上游流量 (m³/s)

  downstream:
    type: depth
    value: 3.5           # 下游水深 (m)

# ============================================================================
# 5. 模拟设置 - 稳态分析
# ============================================================================
simulation:
  type: steady          # 稳态模拟

  # Preissmann求解器参数
  preissmann_max_iter: 10
  max_iterations: 5000
  convergence_tol: 0.001

# ============================================================================
# 6. 输出设置
# ============================================================================
output:
  directory: results_structure_showcase
  prefix: showcase

  formats:
    - npz
    - png

  # 生成详细报告
  generate_report: true
