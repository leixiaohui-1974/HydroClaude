[pytest]
# HydroClaude v2.0 - pytest配置文件

# 测试路径
testpaths = tests/backend tests/e2e

# 命令行选项
addopts = 
    -v
    --strict-markers
    --tb=short
    --color=yes

# 标记
markers =
    unit: 单元测试
    integration: 集成测试
    e2e: 端到端测试
    slow: 运行较慢的测试
    benchmark: 性能基准测试
    solver: 求解器测试
    structure: 水工结构测试
    utils: 工具函数测试

# Python路径
pythonpath = .

# 输出设置
console_output_style = progress

# 警告过滤
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# 覆盖率设置
[coverage:run]
source = solvers, utils
omit = 
    tests/*
    */test_*.py
    */__pycache__/*
    */venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
