[pytest]
# Pytest配置文件

# 测试目录
testpaths = tests unit_tests

# 命令行选项
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:cacheprovider

# 测试文件模式
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# 标记定义
markers =
    # 优先级标记（按DEVELOPMENT_STANDARDS.md定义）
    p0: P0级阻塞测试（BLOCKING）- 必须通过才能提交代码
    p1: P1级关键测试（CRITICAL）- 核心功能验证
    p2: P2级重要测试（IMPORTANT）- 完整性验证
    p3: P3级次要测试（MINOR）- 边缘情况和优化验证

    # 测试类型标记
    unit: 单元测试
    integration: 集成测试
    slow: 运行缓慢的测试
    benchmark: 性能基准测试

    # 功能模块标记
    solver: 求解器测试
    control: 控制系统测试
    structures: 水工结构测试
    examples: 示例测试

# 最小Python版本
minversion = 6.0

# 覆盖率配置（需要pytest-cov插件）
# 运行: pytest --cov=. --cov-report=html
