[pytest]
# Pytest配置文件

# 测试目录
testpaths = tests unit_tests

# 命令行选项
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:cacheprovider

# 测试文件模式
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# 标记定义
markers =
    unit: 单元测试
    integration: 集成测试
    slow: 运行缓慢的测试
    benchmark: 性能基准测试
    solver: 求解器测试
    control: 控制系统测试
    structures: 水工结构测试
    examples: 示例测试

# 最小Python版本
minversion = 6.0

# 覆盖率配置（需要pytest-cov插件）
# 运行: pytest --cov=. --cov-report=html
