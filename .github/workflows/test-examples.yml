name: Test Examples

on:
  push:
    branches: [ main, develop, claude/** ]
    paths:
      - 'examples/**'
      - 'solvers/**'
      - 'physics/**'
      - 'control/**'
      - 'utils/**'
      - '.github/workflows/test-examples.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'examples/**'
  workflow_dispatch:  # 允许手动触发

jobs:
  test-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
      fail-fast: false  # 一个版本失败不影响其他版本

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgl1-mesa-glx \
          libglib2.0-0 \
          libsm6 \
          libxext6 \
          libxrender-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r examples/tests/requirements-test.txt

    - name: Run structure tests
      run: |
        cd examples/tests
        pytest test_examples.py::TestExampleStructure -v --tb=short

    - name: Run example execution tests (fast)
      run: |
        cd examples/tests
        pytest test_examples.py::TestExampleExecution -v --tb=short -m "not slow"
      timeout-minutes: 10

    - name: Run animation quality tests
      run: |
        cd examples/tests
        pytest test_examples.py::TestAnimationQuality -v --tb=short
      continue-on-error: true  # 动画测试失败不影响整体

    - name: Generate test report
      if: always()
      run: |
        cd examples/tests
        pytest test_examples.py --html=report.html --self-contained-html
      continue-on-error: true

    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-report-python-${{ matrix.python-version }}
        path: examples/tests/report.html

    - name: Upload coverage
      if: always()
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: examples
      continue-on-error: true

  test-examples-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r examples/tests/requirements-test.txt

    - name: Run all tests (including slow)
      run: |
        cd examples/tests
        pytest test_examples.py -v --tb=short --maxfail=5

    - name: Run comprehensive test script
      run: |
        cd examples
        chmod +x comprehensive_test.sh
        ./comprehensive_test.sh

    - name: Upload test summary
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: comprehensive-test-summary
        path: /tmp/examples_test_summary.txt
