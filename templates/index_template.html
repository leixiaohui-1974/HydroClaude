<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{{title}} - HydroClaude Results Viewer</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-2.18.0.min.js"></script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="fas fa-water"></i> HydroClaude
            </a>
            <span class="navbar-text text-white" id="sim-title">Loading...</span>
        </div>
    </nav>
    
    <!-- Main Container -->
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-2 d-none d-md-block bg-light sidebar">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link active" href="#overview-section">
                                <i class="fas fa-info-circle"></i> 总览
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#spatial-section">
                                <i class="fas fa-chart-area"></i> 空间分析
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#temporal-section">
                                <i class="fas fa-clock"></i> 时间分析
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#structures-section">
                                <i class="fas fa-cogs"></i> 结构分析
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#validation-section">
                                <i class="fas fa-check-circle"></i> 验证报告
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#export-section">
                                <i class="fas fa-download"></i> 数据导出
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>
            
            <!-- Main Content -->
            <main class="col-md-10 ms-sm-auto px-md-4 main-content">
                
                <!-- Overview Section -->
                <section id="overview-section" class="content-section">
                    <h2 class="section-title">
                        <i class="fas fa-info-circle"></i> 仿真总览
                    </h2>
                    
                    <div class="row g-3 mb-4">
                        <div class="col-md-3">
                            <div class="info-card">
                                <div class="info-label">仿真类型</div>
                                <div class="info-value" id="sim-type">-</div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="info-card">
                                <div class="info-label">状态</div>
                                <div class="info-value">
                                    <span id="sim-status" class="badge">-</span>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="info-card">
                                <div class="info-label">计算时间</div>
                                <div class="info-value" id="compute-time">-</div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="info-card">
                                <div class="info-label">收敛状态</div>
                                <div class="info-value small" id="convergence-status">-</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-header">
                                    <h5 class="mb-0">关键参数统计</h5>
                                </div>
                                <div class="card-body">
                                    <div class="table-responsive">
                                        <table id="stats-table" class="table table-striped table-hover">
                                            <!-- Populated by JS -->
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
                
                <!-- Spatial Analysis Section -->
                <section id="spatial-section" class="content-section mt-5">
                    <h2 class="section-title">
                        <i class="fas fa-chart-area"></i> 空间分析
                    </h2>
                    
                    <!-- Time Selector (for unsteady) -->
                    <div id="time-selector" class="mb-3">
                        <label class="form-label">时间:</label>
                        <input type="range" id="time-slider" class="form-range">
                        <span id="time-display" class="badge bg-secondary">t = 0s</span>
                    </div>
                    
                    <!-- Longitudinal Profile -->
                    <div class="card mb-4">
                        <div class="card-header">
                            <h5 class="mb-0">纵剖面图</h5>
                        </div>
                        <div class="card-body">
                            <div id="plot-longitudinal" class="plot-container"></div>
                        </div>
                    </div>
                    
                    <!-- Variable Selector -->
                    <div class="mb-3">
                        <label class="form-label">选择变量:</label>
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-outline-primary" data-var="depth">水深</button>
                            <button type="button" class="btn btn-outline-primary active" data-var="flow">流量</button>
                            <button type="button" class="btn btn-outline-primary" data-var="velocity">流速</button>
                            <button type="button" class="btn btn-outline-primary" data-var="froude">Froude数</button>
                        </div>
                    </div>
                    
                    <!-- Spatial Distribution -->
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0">空间分布图</h5>
                        </div>
                        <div class="card-body">
                            <div id="plot-spatial-distribution" class="plot-container"></div>
                        </div>
                    </div>
                </section>
                
                <!-- Temporal Analysis Section -->
                <section id="temporal-section" class="content-section mt-5">
                    <h2 class="section-title">
                        <i class="fas fa-clock"></i> 时间分析
                    </h2>
                    
                    <!-- Location Selector -->
                    <div class="mb-3">
                        <label class="form-label">监测点位置:</label>
                        <select id="location-selector" class="form-select" multiple size="3">
                            <!-- Populated by JS -->
                        </select>
                    </div>
                    
                    <!-- Time Series -->
                    <div class="card mb-4">
                        <div class="card-header">
                            <h5 class="mb-0">时间序列</h5>
                        </div>
                        <div class="card-body">
                            <div id="plot-time-series" class="plot-container"></div>
                        </div>
                    </div>
                    
                    <!-- Contour -->
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0">时空等值线</h5>
                        </div>
                        <div class="card-body">
                            <div id="plot-contour" class="plot-container"></div>
                        </div>
                    </div>
                </section>
                
                <!-- Structures Section -->
                <section id="structures-section" class="content-section mt-5">
                    <h2 class="section-title">
                        <i class="fas fa-cogs"></i> 水工结构分析
                    </h2>
                    
                    <div id="structure-cards">
                        <!-- Populated by JS -->
                    </div>
                </section>
                
                <!-- Validation Section -->
                <section id="validation-section" class="content-section mt-5">
                    <h2 class="section-title">
                        <i class="fas fa-check-circle"></i> 验证报告
                    </h2>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="card mb-3">
                                <div class="card-header">
                                    <h5 class="mb-0">验证评分雷达图</h5>
                                </div>
                                <div class="card-body">
                                    <div id="plot-validation-radar" class="plot-container" style="height: 400px;"></div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="col-md-6">
                            <div class="card mb-3">
                                <div class="card-header">
                                    <h5 class="mb-0">详细评分</h5>
                                </div>
                                <div class="card-body">
                                    <div class="mb-3">
                                        <label class="form-label">质量守恒</label>
                                        <div class="progress" style="height: 30px;">
                                            <div id="mass-conservation-bar" class="progress-bar" role="progressbar">
                                                -
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label class="form-label">能量守恒</label>
                                        <div class="progress" style="height: 30px;">
                                            <div id="energy-conservation-bar" class="progress-bar" role="progressbar">
                                                -
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label class="form-label">稳定性</label>
                                        <div class="progress" style="height: 30px;">
                                            <div id="stability-bar" class="progress-bar" role="progressbar">
                                                -
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="alert alert-info">
                                        <strong>总体评分:</strong> 
                                        <span id="validation-score">-</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
                
                <!-- Export Section -->
                <section id="export-section" class="content-section mt-5 mb-5">
                    <h2 class="section-title">
                        <i class="fas fa-download"></i> 数据导出
                    </h2>
                    
                    <div class="card">
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6">
                                    <h5>数据文件</h5>
                                    <div class="d-grid gap-2">
                                        <button id="download-json" class="btn btn-primary">
                                            <i class="fas fa-file-code"></i> 下载 JSON
                                        </button>
                                        <button id="download-csv" class="btn btn-success">
                                            <i class="fas fa-file-csv"></i> 导出 CSV
                                        </button>
                                    </div>
                                </div>
                                
                                <div class="col-md-6">
                                    <h5>图表</h5>
                                    <div class="d-grid gap-2">
                                        <button id="download-plots" class="btn btn-info">
                                            <i class="fas fa-chart-line"></i> 下载所有图表
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
                
            </main>
        </div>
    </div>
    
    <!-- Footer -->
    <footer class="footer mt-auto py-3 bg-light">
        <div class="container text-center">
            <span class="text-muted">
                Powered by <strong>HydroClaude</strong> v1.0.0 | 
                Commercial-Grade Open Source Hydraulics Software
            </span>
        </div>
    </footer>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Hydro Viewer -->
    <script src="hydro_viewer.js"></script>
</body>
</html>
