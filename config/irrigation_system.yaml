# 灌区配水系统配置
# 用于灌溉水资源优化分配和实时调度

name: 灌区配水系统
description: 包含1个调蓄水库、3条干渠、5个分水闸门的灌区配水系统

# 调蓄水库
reservoirs:
  - id: main_reservoir
    total_capacity: 20000000.0     # 总库容 2000万m³
    min_level: 180.0               # 最低水位 (m)
    normal_level: 195.0            # 正常蓄水位 (m)
    flood_level: 198.0             # 防洪限制水位 (m)
    design_level: 200.0            # 设计洪水位 (m)
    dead_storage: 2000000.0        # 死库容 200万m³
    turbine_capacity: 0.0          # 无发电功能
    turbine_efficiency: 0.0
    ecological_flow: 5.0           # 生态流量 (m³/s)
    initial_storage: 15000000.0    # 初始蓄水量 1500万m³

# 干渠系统
canals:
  # 东干渠 - 供水面积最大
  - id: east_main_canal
    length: 12000.0                # 12km
    nx: 61                         # 网格点数
    width: 8.0                     # 渠宽 (m)
    slope: 0.0003                  # 较缓坡度
    roughness: 0.022               # 混凝土衬砌
    initial_depth: 1.5             # 初始水深 (m)
    initial_flow: 8.0              # 初始流量 (m³/s)

  # 西干渠 - 地形较陡
  - id: west_main_canal
    length: 8000.0                 # 8km
    nx: 41
    width: 6.0                     # 渠宽 (m)
    slope: 0.0005                  # 较陡坡度
    roughness: 0.022
    initial_depth: 1.2
    initial_flow: 5.0              # (m³/s)

  # 南干渠 - 中等规模
  - id: south_main_canal
    length: 10000.0                # 10km
    nx: 51
    width: 7.0                     # 渠宽 (m)
    slope: 0.0004
    roughness: 0.022
    initial_depth: 1.3
    initial_flow: 6.0              # (m³/s)

# 分水闸门
gates:
  # 东干渠进水闸
  - id: gate_east_inlet
    position: 0.0                  # 水库出口
    width: 8.0                     # 闸宽 (m)
    opening: 2.5                   # 开度 (m)
    discharge_coefficient: 0.6
    gate_type: sluice

  # 西干渠进水闸
  - id: gate_west_inlet
    position: 0.0
    width: 6.0
    opening: 2.0
    discharge_coefficient: 0.6
    gate_type: sluice

  # 南干渠进水闸
  - id: gate_south_inlet
    position: 0.0
    width: 7.0
    opening: 2.2
    discharge_coefficient: 0.6
    gate_type: sluice

  # 东干渠中段分水闸（供支渠）
  - id: gate_east_middle
    position: 6000.0               # 中点位置
    width: 4.0
    opening: 1.5
    discharge_coefficient: 0.6
    gate_type: sluice

  # 南干渠中段分水闸
  - id: gate_south_middle
    position: 5000.0
    width: 3.5
    opening: 1.2
    discharge_coefficient: 0.6
    gate_type: sluice

# 控制器 - 用于自动调节闸门
controllers:
  # 东干渠水深控制
  - id: PID_east_canal_depth
    Kp: 0.3                        # 比例系数
    Ki: 0.05                       # 积分系数
    Kd: 0.02                       # 微分系数
    setpoint: 1.5                  # 目标水深 (m)
    output_min: 0.5                # 最小闸门开度 (m)
    output_max: 3.0                # 最大闸门开度 (m)
    anti_windup: true              # 抗积分饱和

  # 西干渠水深控制
  - id: PID_west_canal_depth
    Kp: 0.3
    Ki: 0.05
    Kd: 0.02
    setpoint: 1.2
    output_min: 0.5
    output_max: 2.5
    anti_windup: true

  # 水库水位控制
  - id: PID_reservoir_level
    Kp: 0.8
    Ki: 0.15
    Kd: 0.08
    setpoint: 195.0                # 维持正常蓄水位
    output_min: 5.0                # 最小总出流 (m³/s)
    output_max: 30.0               # 最大总出流 (m³/s)
    anti_windup: true

# 系统拓扑
topology:
  # 水库到三条干渠
  - from_node: main_reservoir
    to_node: east_main_canal
    travel_time: 300               # 渠首段延迟 5分钟
    connection_type: gated

  - from_node: main_reservoir
    to_node: west_main_canal
    travel_time: 300
    connection_type: gated

  - from_node: main_reservoir
    to_node: south_main_canal
    travel_time: 300
    connection_type: gated

# 优化目标 - 灌溉配水
optimization:
  objective: fair_water_distribution  # 公平配水
  constraints:
    min_flow: true                    # 保证最小流量
    max_water_level: true             # 水位上限约束
    ecological_flow: true             # 生态流量约束
  algorithm: multi_objective          # 多目标优化
  horizon: 168                        # 优化时域 7天 (小时)

  # 灌溉需求曲线
  irrigation_demand:
    east_zone: [12.0, 10.0, 8.0, 6.0, 8.0, 10.0, 12.0]  # 每天需水量 (m³/s)
    west_zone: [8.0, 7.0, 6.0, 5.0, 6.0, 7.0, 8.0]
    south_zone: [10.0, 9.0, 7.0, 6.0, 7.0, 9.0, 10.0]

# 仿真配置
simulation:
  duration: 604800                    # 仿真时长 7天 (s)
  timestep: 300                       # 时间步长 5分钟 (s)
  solver: implicit                    # 隐式求解器
  output_interval: 1800               # 输出间隔 30分钟 (s)

  # 边界条件
  inflow_scenario: irrigation_season  # 灌溉季节径流

  # 初始条件
  initial_conditions:
    reservoir_level: 195.0            # 初始水位 (m)
    canal_depths: uniform             # 渠道均匀水深
    gate_openings: preset             # 预设闸门开度

# 应用场景说明
application:
  use_case: 灌区实时配水调度
  features:
    - 多渠道水量分配优化
    - 水库-渠系联合调度
    - 公平性约束保证
    - 实时反馈控制
  typical_operations:
    - 灌溉高峰期配水
    - 轮灌制度执行
    - 应急调水响应
    - 节水灌溉优化
