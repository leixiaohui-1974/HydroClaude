# ========================================================================
# 示例2：单闸门系统
# 
# 用途：测试单个闸门的水力学特性
# 适合：闸门设计、流量控制分析
# ========================================================================

canal:
  length: 10000.0
  width: 10.0
  slope: 0.001
  manning: 0.025

structures:
  - type: gate
    name: "控制闸门"
    position: 5000.0    # 中点
    width: 10.0
    opening: 3.0        # 3m开度

boundary:
  upstream:
    type: flow
    value: 10.0
  downstream:
    type: depth
    value: 2.0

solver:
  method: hybrid_fvfd
  steady_state:
    max_iter: 1000
    tolerance: 0.01

output:
  directory: "results/single_gate/"
  prefix: "gate"
  formats: [csv]
  plots: [profile]
